<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptGenz - AI Prompt Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white font-sans min-h-screen pb-20">

    <header class="p-4 flex items-center justify-between border-b border-zinc-900 sticky top-0 bg-zinc-950/80 backdrop-blur-md z-30">
        <h1 class="text-lg font-bold text-amber-400">PromptGenz</h1>
        <div class="flex items-center space-x-3">
            <a href="admin.html" class="bg-zinc-900 border border-zinc-800 text-amber-400 p-2.5 rounded-full text-xs hover:bg-zinc-800 transition">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </a>
            <div class="w-8 h-8 rounded-full bg-zinc-800 border border-zinc-700 overflow-hidden flex items-center justify-center">
                <i class="fa-solid fa-user text-zinc-400 text-xs"></i>
            </div>
        </div>
    </header>

    <div class="p-4">
        <div class="relative bg-zinc-900 border border-zinc-800 rounded-2xl flex items-center px-4 py-3 focus-within:border-amber-400 transition">
            <i class="fa-solid fa-magnifying-glass text-zinc-500 mr-3 text-sm"></i>
            <input type="text" id="searchInput" placeholder="Search prompts, tags, themes..." class="bg-transparent border-none outline-none text-white w-full text-sm placeholder-zinc-600">
        </div>
    </div>

    <main class="px-4">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-sm font-bold text-zinc-300">Live Gallery</h2>
            <span class="text-[10px] text-amber-400 flex items-center"><i class="fa-solid fa-bolt mr-1"></i> Real-time sync</span>
        </div>

        <div id="galleryGrid" class="grid grid-cols-2 gap-3">
            <!-- Cards will load dynamically -->
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-zinc-950/90 backdrop-blur-md border-t border-zinc-900 px-6 py-3 flex justify-between items-center z-30 max-w-md mx-auto rounded-t-3xl">
        <a href="index.html" class="text-amber-400 flex flex-col items-center"><i class="fa-solid fa-house text-base"></i></a>
        <a href="#" class="text-zinc-500 hover:text-zinc-300 flex flex-col items-center"><i class="fa-solid fa-compass text-base"></i></a>
        <a href="#" class="text-zinc-500 hover:text-zinc-300 flex flex-col items-center"><i class="fa-solid fa-heart text-base"></i></a>
        <a href="admin.html" class="text-zinc-500 hover:text-zinc-300 flex flex-col items-center"><i class="fa-solid fa-user text-base"></i></a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAcyASMFEogpp8BwgJc4hsPGNoIZOb6dKo",
            authDomain: "promptgenz-daaf3.firebaseapp.com",
            projectId: "promptgenz-daaf3",
            storageBucket: "promptgenz-daaf3.firebasestorage.app",
            messagingSenderId: "751005531769",
            appId: "1:751005531769:web:20b8330970e001dd691ea8",
            measurementId: "G-VF4QP1SLSQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allPosts = [];

        window.addEventListener('DOMContentLoaded', fetchGalleryData);

        async function fetchGalleryData() {
            const galleryGrid = document.getElementById('galleryGrid');
            try {
                const q = query(collection(db, "prompts"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                allPosts = [];
                querySnapshot.forEach((docSnap) => {
                    allPosts.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderGallery(allPosts);
            } catch (error) {
                console.error("Error:", error);
            }
        }

        function renderGallery(posts) {
            const galleryGrid = document.getElementById('galleryGrid');
            galleryGrid.innerHTML = "";

            if (posts.length === 0) {
                galleryGrid.innerHTML = '<div class="col-span-2 text-center py-10 text-xs text-zinc-500">No prompts found.</div>';
                return;
            }

            posts.forEach(post => {
                let thumb = post.imagePromptPairs?.[0]?.imageUrl || post.imageUrls?.[0] || "";
                const card = document.createElement('div');
                card.className = "bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-lg relative group cursor-pointer flex flex-col";
                card.innerHTML = `
                    <div class="relative w-full h-56 bg-zinc-950 overflow-hidden">
                        <img src="${thumb}" class="files-img w-full h-full object-cover group-hover:scale-105 transition duration-300">
                    </div>
                    <div class="p-3 flex flex-col justify-between flex-1">
                        <h3 class="text-xs font-semibold text-white truncate">${post.title || "Untitled"}</h3>
                        <p class="text-[10px] text-amber-400 mt-1">${post.category || "General"}</p>
                    </div>
                `;
                // Click karne par detail page par redirect hoga ID ke sath
                card.addEventListener('click', () => {
                    window.location.href = `detail.html?id=${post.id}`;
                });
                galleryGrid.appendChild(card);
            });
        }
    </script>
</body>
</html>
