<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptGenz - AI Prompt Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-zinc-950 text-white font-sans min-h-screen pb-20">

    <!-- Top Header -->
    <header class="p-4 flex items-center justify-between border-b border-zinc-900 sticky top-0 bg-zinc-950/80 backdrop-blur-md z-30">
        <h1 class="text-lg font-bold text-amber-400">PromptGenz</h1>
        <div class="flex items-center space-x-3">
            <a href="admin.html" class="bg-zinc-900 border border-zinc-800 text-amber-400 p-2.5 rounded-full text-xs hover:bg-zinc-800 transition">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </a>
            <div onclick="openProfileModal()" class="w-8 h-8 rounded-full bg-zinc-800 border border-zinc-700 overflow-hidden flex items-center justify-center cursor-pointer hover:border-amber-400 transition">
                <i class="fa-solid fa-user text-zinc-400 text-xs"></i>
            </div>
        </div>
    </header>

    <!-- Search Bar -->
    <div class="p-4">
        <div class="relative bg-zinc-900 border border-zinc-800 rounded-2xl flex items-center px-4 py-3 focus-within:border-amber-400 transition">
            <i class="fa-solid fa-magnifying-glass text-zinc-500 mr-3 text-sm"></i>
            <input type="text" id="searchInput" placeholder="Search prompts, tags, themes..." class="bg-transparent border-none outline-none text-white w-full text-sm placeholder-zinc-600">
        </div>
    </div>

    <!-- Live Gallery Section -->
    <main class="px-4">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-sm font-bold text-zinc-300">Live Gallery</h2>
            <span class="text-[10px] text-amber-400 flex items-center"><i class="fa-solid fa-bolt mr-1"></i> Real-time sync</span>
        </div>

        <div id="galleryGrid" class="grid grid-cols-2 gap-3">
            <!-- Dynamic cards will load here -->
        </div>
    </main>

    <!-- Prompt Detail Popup Modal -->
    <div id="detailModal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden z-50 flex flex-col justify-end items-center p-0">
        <div class="bg-zinc-950 border-t border-zinc-800 w-full max-w-lg h-[92vh] rounded-t-[32px] overflow-y-auto flex flex-col relative shadow-2xl p-5 space-y-5">
            
            <!-- Close Button -->
            <button id="closeModalBtn" class="absolute top-5 right-5 bg-zinc-800/80 hover:bg-zinc-700 text-white w-9 h-9 rounded-full flex items-center justify-center z-20 transition cursor-pointer">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>

            <!-- Modal Content Body -->
            <div id="modalBody" class="space-y-5 pb-10">
                <!-- Dynamically populated via JS -->
            </div>
        </div>
    </div>

    <!-- Profile Popup Modal -->
    <div id="profileModal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden z-50 flex flex-col justify-end items-center p-0">
        <div class="bg-zinc-950 border-t border-zinc-800 w-full max-w-lg h-[85vh] rounded-t-[32px] overflow-y-auto flex flex-col relative shadow-2xl p-6 space-y-6">
            
            <!-- Close Button -->
            <button onclick="closeProfileModal()" class="absolute top-5 right-5 bg-zinc-800/80 hover:bg-zinc-700 text-white w-9 h-9 rounded-full flex items-center justify-center z-20 transition cursor-pointer">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>

            <!-- Profile Header Info -->
            <div class="flex items-center space-x-4 pt-2">
                <div class="w-16 h-16 rounded-full bg-zinc-900 border-2 border-amber-400 flex items-center justify-center text-amber-400 text-xl shadow-md">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <h3 class="text-base font-bold text-white">Guest User</h3>
                    <p class="text-xs text-zinc-400">Sign in to sync your saved prompts</p>
                </div>
            </div>

            <!-- Login with Google Button -->
            <button onclick="alert('Google Login integration coming soon!')" class="w-full bg-white hover:bg-zinc-200 text-zinc-900 py-3.5 rounded-2xl text-sm font-bold transition flex items-center justify-center space-x-3 shadow-lg cursor-pointer">
                <i class="fa-brands fa-google text-red-500 text-base"></i>
                <span>Login with Google</span>
            </button>

            <hr class="border-zinc-900 my-2">

            <!-- Website Navigation / Information Links -->
            <div class="space-y-3">
                <h4 class="text-xs font-bold text-zinc-400 uppercase tracking-wider">More Information</h4>
                
                <div class="space-y-2">
                    <button onclick="openInfoPage('About Us', 'PromptGenz is an ultimate AI prompt gallery where creators and enthusiasts discover, share, and copy high-quality prompts for Midjourney, DALL-E, Stable Diffusion, and more.')" class="w-full bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 p-3.5 rounded-2xl flex items-center justify-between text-xs font-medium transition cursor-pointer">
                        <span class="flex items-center text-zinc-200"><i class="fa-solid fa-circle-info text-amber-400 mr-3 w-4"></i> About Us</span>
                        <i class="fa-solid fa-chevron-right text-zinc-500 text-[10px]"></i>
                    </button>

                    <button onclick="openInfoPage('Terms & Conditions', 'By using PromptGenz, you agree to respect community guidelines, use prompts responsibly, and refrain from scraping or misusing user-generated content.')" class="w-full bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 p-3.5 rounded-2xl flex items-center justify-between text-xs font-medium transition cursor-pointer">
                        <span class="flex items-center text-zinc-200"><i class="fa-solid fa-file-contract text-amber-400 mr-3 w-4"></i> Terms & Conditions</span>
                        <i class="fa-solid fa-chevron-right text-zinc-500 text-[10px]"></i>
                    </button>

                    <button onclick="openInfoPage('Contact Us', 'Have questions, feedback, or need help? Reach out to our support team directly at support@promptgenz.app or via our official channels.')" class="w-full bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 p-3.5 rounded-2xl flex items-center justify-between text-xs font-medium transition cursor-pointer">
                        <span class="flex items-center text-zinc-200"><i class="fa-solid fa-headset text-amber-400 mr-3 w-4"></i> Contact Us</span>
                        <i class="fa-solid fa-chevron-right text-zinc-500 text-[10px]"></i>
                    </button>
                </div>
            </div>

            <!-- Version Info -->
            <div class="text-center pt-4">
                <span class="text-[10px] text-zinc-600">PromptGenz v1.0.0 · Built for Creators</span>
            </div>
        </div>
    </div>

    <!-- Info Sub-Modal (For About, Terms, Contact details view) -->
    <div id="infoModal" class="fixed inset-0 bg-black/95 backdrop-blur-md hidden z-[60] flex items-center justify-center p-6">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-3xl p-6 space-y-4 shadow-2xl relative">
            <h3 id="infoModalTitle" class="text-base font-bold text-amber-400"></h3>
            <p id="infoModalText" class="text-xs text-zinc-300 leading-relaxed"></p>
            <button onclick="closeInfoPage()" class="w-full bg-zinc-800 hover:bg-zinc-700 text-white py-2.5 rounded-xl text-xs font-semibold transition cursor-pointer mt-2">Close</button>
        </div>
    </div>

    <!-- Bottom Navigation Bar (Compass/Second button removed) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-zinc-950/90 backdrop-blur-md border-t border-zinc-900 px-8 py-3 flex justify-around items-center z-30 max-w-md mx-auto rounded-t-3xl">
        <a href="index.html" class="text-amber-400 flex flex-col items-center"><i class="fa-solid fa-house text-base"></i></a>
        <a href="#" class="text-zinc-500 hover:text-zinc-300 flex flex-col items-center"><i class="fa-solid fa-heart text-base"></i></a>
        <button onclick="openProfileModal()" class="text-zinc-500 hover:text-zinc-300 flex flex-col items-center bg-transparent border-none cursor-pointer"><i class="fa-solid fa-user text-base"></i></button>
    </nav>

    <!-- Script Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAcyASMFEogpp8BwgJc4hsPGNoIZOb6dKo",
            authDomain: "promptgenz-daaf3.firebaseapp.com",
            projectId: "promptgenz-daaf3",
            storageBucket: "promptgenz-daaf3.firebasestorage.app",
            messagingSenderId: "751005531769",
            appId: "1:751005531769:web:20b8330970e001dd691ea8",
            measurementId: "G-VF4QP1SLSQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allPosts = [];

        window.addEventListener('DOMContentLoaded', fetchGalleryData);

        async function fetchGalleryData() {
            const galleryGrid = document.getElementById('galleryGrid');
            galleryGrid.innerHTML = '<div class="col-span-2 text-center py-10 text-xs text-zinc-500"><i class="fa-solid fa-spinner animate-spin mr-1"></i> Loading prompts...</div>';

            try {
                const q = query(collection(db, "prompts"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                allPosts = [];
                querySnapshot.forEach((docSnap) => {
                    allPosts.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderGallery(allPosts);
            } catch (error) {
                console.error("Error:", error);
                galleryGrid.innerHTML = '<div class="col-span-2 text-center py-10 text-xs text-red-400">Failed to load items.</div>';
            }
        }

        function renderGallery(posts) {
            const galleryGrid = document.getElementById('galleryGrid');
            galleryGrid.innerHTML = "";

            if (posts.length === 0) {
                galleryGrid.innerHTML = '<div class="col-span-2 text-center py-10 text-xs text-zinc-500">No prompts found.</div>';
                return;
            }

            posts.forEach(post => {
                let thumb = post.imagePromptPairs?.[0]?.imageUrl || post.imageUrls?.[0] || "";
                const card = document.createElement('div');
                card.className = "bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-lg relative group cursor-pointer flex flex-col";
                card.innerHTML = `
                    <div class="relative w-full h-56 bg-zinc-950 overflow-hidden">
                        <img src="${thumb}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                    </div>
                    <div class="p-3 flex flex-col justify-between flex-1">
                        <h3 class="text-xs font-semibold text-white truncate">${post.title || "Untitled"}</h3>
                        <p class="text-[10px] text-amber-400 mt-1">${post.category || "General"}</p>
                    </div>
                `;
                card.addEventListener('click', () => openDetailModal(post));
                galleryGrid.appendChild(card);
            });
        }

        window.openDetailModal = function(post) {
            const modal = document.getElementById('detailModal');
            const modalBody = document.getElementById('modalBody');

            let pairs = post.imagePromptPairs || [];
            if (pairs.length === 0 && post.imageUrls) {
                pairs = post.imageUrls.map(url => ({ imageUrl: url, prompt: post.promptText || "Detailed visual prompt" }));
            }

            let currentMainImage = pairs[0]?.imageUrl || "";
            let currentPromptText = pairs[0]?.prompt || "Detailed visual prompt";

            let horizontalAnglesHtml = "";
            if (pairs.length > 1) {
                pairs.forEach((pair, idx) => {
                    horizontalAnglesHtml += `
                        <div onclick="updateModalMainImage('${pair.imageUrl}', \`${pair.prompt.replace(/["`]/g, "'")}\`)" class="flex-shrink-0 w-20 h-20 rounded-xl overflow-hidden border-2 ${idx === 0 ? 'border-amber-400' : 'border-zinc-800'} cursor-pointer transition hover:opacity-80">
                            <img src="${pair.imageUrl}" class="w-full h-full object-cover">
                        </div>
                    `;
                });
            }

            let suggestions = allPosts.filter(p => p.category === post.category && p.id !== post.id).slice(0, 5);
            let suggestedHtml = "";

            if (suggestions.length > 0) {
                suggestions.forEach(sug => {
                    let sugThumb = sug.imagePromptPairs?.[0]?.imageUrl || sug.imageUrls?.[0] || "";
                    suggestedHtml += `
                        <div data-id="${sug.id}" class="suggestion-card flex-shrink-0 w-28 bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden cursor-pointer group shadow-md">
                            <img src="${sugThumb}" class="w-full h-32 object-cover group-hover:scale-105 transition">
                            <p class="text-[10px] text-zinc-300 p-2 truncate">${sug.title}</p>
                        </div>
                    `;
                });
            } else {
                suggestedHtml = `<p class="text-xs text-zinc-500 py-2">No related suggestions.</p>`;
            }

            modalBody.innerHTML = `
                <div class="w-full h-[340px] bg-zinc-900 rounded-[24px] overflow-hidden border border-zinc-800 shadow-xl relative">
                    <img id="activeModalImage" src="${currentMainImage}" class="w-full h-full object-cover">
                </div>

                ${pairs.length > 1 ? `
                <div class="space-y-1.5">
                    <span class="text-[10px] text-amber-400 font-semibold uppercase tracking-wider"><i class="fa-solid fa-angles-right mr-1"></i> Select Angle (${pairs.length})</span>
                    <div class="flex space-x-2 overflow-x-auto pb-1 scrollbar-none">
                        ${horizontalAnglesHtml}
                    </div>
                </div>` : ''}

                <div class="space-y-2">
                    <h2 class="text-lg font-bold text-white leading-snug">${post.title}</h2>
                    <div class="flex items-center space-x-3 text-xs text-zinc-400">
                        <span class="flex items-center text-amber-400"><i class="fa-solid fa-star mr-1"></i> Rate this</span>
                        <span><i class="fa-regular fa-eye mr-1"></i> 401 views · 192 uses</span>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <button onclick="alert('Added to saved!')" class="flex-1 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 py-3 rounded-2xl text-xs font-semibold flex items-center justify-center space-x-2 transition cursor-pointer">
                        <i class="fa-regular fa-heart text-amber-400 text-sm"></i>
                        <span>Save</span>
                    </button>
                    <button onclick="navigator.clipboard.writeText(window.location.href); alert('Link copied!');" class="w-12 h-12 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 rounded-2xl flex items-center justify-center transition cursor-pointer">
                        <i class="fa-solid fa-arrow-up-from-bracket text-amber-400 text-sm"></i>
                    </button>
                    <button onclick="alert('Options')" class="w-12 h-12 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 rounded-2xl flex items-center justify-center transition cursor-pointer">
                        <i class="fa-solid fa-ellipsis-vertical text-amber-400 text-sm"></i>
                    </button>
                </div>

                <button id="copyPromptBtn" onclick="navigator.clipboard.writeText(` + "`" + `${currentPromptText}` + "`" + `); alert('Prompt copied successfully!');" class="w-full bg-[#8ae9c1] hover:bg-[#74dfb4] text-zinc-950 py-3.5 rounded-2xl text-sm font-bold transition flex items-center justify-center space-x-2 shadow-lg cursor-pointer">
                    <i class="fa-regular fa-copy"></i>
                    <span>Copy Prompt</span>
                </button>

                <div class="space-y-3 pt-2">
                    <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider">More like this</h3>
                    <div class="flex space-x-3 overflow-x-auto pb-2 scrollbar-none">
                        ${suggestedHtml}
                    </div>
                </div>

                <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl flex items-center justify-between">
                    <span class="text-xs font-medium text-zinc-300">Rate this prompt</span>
                    <div class="flex space-x-1 text-amber-400 text-sm">
                        <i class="fa-solid fa-star cursor-pointer"></i>
                        <i class="fa-solid fa-star cursor-pointer"></i>
                        <i class="fa-solid fa-star cursor-pointer"></i>
                        <i class="fa-solid fa-star cursor-pointer"></i>
                        <i class="fa-solid fa-star cursor-pointer"></i>
                    </div>
                </div>

                <div class="bg-zinc-900/50 border border-zinc-800/80 p-3.5 rounded-2xl flex items-center justify-between">
                    <span class="text-xs text-zinc-400"><i class="fa-solid fa-tag mr-2"></i> ${post.category || "All tags"}</span>
                    <i class="fa-solid fa-chevron-down text-zinc-500 text-xs"></i>
                </div>

                <div class="bg-gradient-to-r from-amber-200 via-amber-300 to-amber-400 text-zinc-950 p-4 rounded-2xl flex items-center justify-between shadow-lg cursor-pointer">
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 bg-zinc-950/10 rounded-full flex items-center justify-center">
                            <i class="fa-solid fa-star text-zinc-950 text-sm"></i>
                        </div>
                        <div>
                            <h4 class="text-xs font-bold">Go Premium</h4>
                            <p class="text-[10px] text-zinc-900">Remove ads · unlock everything</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </div>
            `;

            modal.classList.remove('hidden');

            setTimeout(() => {
                document.querySelectorAll('.suggestion-card').forEach(el => {
                    const sid = el.getAttribute('data-id');
                    el.addEventListener('click', () => {
                        const targetPost = allPosts.find(p => p.id === sid);
                        if (targetPost) openDetailModal(targetPost);
                    });
                });
            }, 100);
        }

        window.updateModalMainImage = function(imageUrl, promptText) {
            document.getElementById('activeModalImage').src = imageUrl;
            const copyBtn = document.getElementById('copyPromptBtn');
            copyBtn.setAttribute('onclick', `navigator.clipboard.writeText(\`${promptText}\`); alert('Prompt copied successfully!');`);
        }

        window.openProfileModal = function() {
            document.getElementById('profileModal').classList.remove('hidden');
        }

        window.closeProfileModal = function() {
            document.getElementById('profileModal').classList.add('hidden');
        }

        window.openInfoPage = function(title, text) {
            document.getElementById('infoModalTitle').innerText = title;
            document.getElementById('infoModalText').innerText = text;
            document.getElementById('infoModal').classList.remove('hidden');
        }

        window.closeInfoPage = function() {
            document.getElementById('infoModal').classList.add('hidden');
        }

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            document.getElementById('detailModal').classList.add('hidden');
        });

        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target.id === 'detailModal') {
                document.getElementById('detailModal').classList.add('hidden');
            }
        });

        document.getElementById('profileModal').addEventListener('click', (e) => {
            if (e.target.id === 'profileModal') {
                document.getElementById('profileModal').classList.add('hidden');
            }
        });

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const filtered = allPosts.filter(p => 
                p.title.toLowerCase().includes(term) || 
                p.category.toLowerCase().includes(term)
            );
            renderGallery(filtered);
        });
    </script>
</body>
</html>
