<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptGenz - AI Prompt Gallery</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white font-sans min-h-screen pb-20">

    <!-- Top Header -->
    <header class="p-4 flex items-center justify-between border-b border-zinc-900 sticky top-0 bg-zinc-950/80 backdrop-blur-md z-30">
        <h1 class="text-lg font-bold text-amber-400">PromptGenz</h1>
        <div class="flex items-center space-x-3">
            <a href="admin.html" class="bg-zinc-900 border border-zinc-800 text-amber-400 p-2.5 rounded-full text-xs hover:bg-zinc-800 transition">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </a>
            <div class="w-8 h-8 rounded-full bg-zinc-800 border border-zinc-700 overflow-hidden flex items-center justify-center">
                <i class="fa-solid fa-user text-zinc-400 text-xs"></i>
            </div>
        </div>
    </header>

    <!-- Search Bar -->
    <div class="p-4">
        <div class="relative bg-zinc-900 border border-zinc-800 rounded-2xl flex items-center px-4 py-3 focus-within:border-amber-400 transition">
            <i class="fa-solid fa-magnifying-glass text-zinc-500 mr-3 text-sm"></i>
            <input type="text" id="searchInput" placeholder="Search prompts, tags, themes..." class="bg-transparent border-none outline-none text-white w-full text-sm placeholder-zinc-600">
        </div>
    </div>

    <!-- Live Gallery Section -->
    <main class="px-4">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-sm font-bold text-zinc-300">Live Gallery</h2>
            <span class="text-[10px] text-amber-400 flex items-center"><i class="fa-solid fa-bolt mr-1"></i> Real-time sync</span>
        </div>

        <!-- Gallery Grid Container -->
        <div id="galleryGrid" class="grid grid-cols-2 gap-3">
            <!-- Dynamic cards will load here -->
        </div>
    </main>

    <!-- Detail Popup Modal -->
    <div id="detailModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden z-50 flex flex-col justify-end sm:justify-center items-center p-0 sm:p-4">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-lg h-[90vh] sm:h-auto sm:max-h-[85vh] rounded-t-3xl sm:rounded-3xl overflow-y-auto flex flex-col relative shadow-2xl">
            
            <!-- Close Button -->
            <button id="closeModalBtn" class="absolute top-4 right-4 bg-zinc-800 hover:bg-zinc-700 text-white w-8 h-8 rounded-full flex items-center justify-center z-20 transition cursor-pointer">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>

            <!-- Modal Content Body -->
            <div id="modalBody" class="p-5 space-y-6">
                <!-- Dynamically populated card details -->
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-zinc-950/90 backdrop-blur-md border-t border-zinc-900 px-6 py-3 flex justify-between items-center z-30 max-w-md mx-auto rounded-t-3xl">
        <a href="index.html" class="text-amber-400 flex flex-col items-center"><i class="fa-solid fa-house text-base"></i></a>
        <a href="#" class="text-zinc-500 hover:text-zinc-300 flex flex-col items-center"><i class="fa-solid fa-compass text-base"></i></a>
        <a href="#" class="text-zinc-500 hover:text-zinc-300 flex flex-col items-center"><i class="fa-solid fa-heart text-base"></i></a>
        <a href="admin.html" class="text-zinc-500 hover:text-zinc-300 flex flex-col items-center"><i class="fa-solid fa-user text-base"></i></a>
    </nav>

    <!-- Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAcyASMFEogpp8BwgJc4hsPGNoIZOb6dKo",
            authDomain: "promptgenz-daaf3.firebaseapp.com",
            projectId: "promptgenz-daaf3",
            storageBucket: "promptgenz-daaf3.firebasestorage.app",
            messagingSenderId: "751005531769",
            appId: "1:751005531769:web:20b8330970e001dd691ea8",
            measurementId: "G-VF4QP1SLSQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allPosts = [];

        window.addEventListener('DOMContentLoaded', () => {
            fetchGalleryData();
        });

        async function fetchGalleryData() {
            const galleryGrid = document.getElementById('galleryGrid');
            galleryGrid.innerHTML = '<div class="col-span-2 text-center py-10 text-xs text-zinc-500"><i class="fa-solid fa-spinner animate-spin mr-1"></i> Loading prompts...</div>';

            try {
                const q = query(collection(db, "prompts"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                allPosts = [];

                querySnapshot.forEach((docSnap) => {
                    allPosts.push({ id: docSnap.id, ...docSnap.data() });
                });

                renderGallery(allPosts);
            } catch (error) {
                console.error("Error fetching data:", error);
                galleryGrid.innerHTML = '<div class="col-span-2 text-center py-10 text-xs text-red-400">Failed to load gallery items.</div>';
            }
        }

        function renderGallery(posts) {
            const galleryGrid = document.getElementById('galleryGrid');
            galleryGrid.innerHTML = "";

            if (posts.length === 0) {
                galleryGrid.innerHTML = '<div class="col-span-2 text-center py-10 text-xs text-zinc-500">No prompts found.</div>';
                return;
            }

            posts.forEach(post => {
                let thumb = "";
                if (post.imagePromptPairs && post.imagePromptPairs.length > 0) {
                    thumb = post.imagePromptPairs[0].imageUrl;
                } else if (post.imageUrls && post.imageUrls.length > 0) {
                    thumb = post.imageUrls[0];
                }

                const card = document.createElement('div');
                card.className = "bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-lg relative group cursor-pointer flex flex-col";
                card.innerHTML = `
                    <div class="relative w-full h-56 bg-zinc-950 overflow-hidden">
                        <img src="${thumb}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                    </div>
                    <div class="p-3 flex flex-col justify-between flex-1">
                        <h3 class="text-xs font-semibold text-white truncate">${post.title || "Untitled Prompt"}</h3>
                        <p class="text-[10px] text-amber-400 mt-1">${post.category || "General"}</p>
                    </div>
                `;

                card.addEventListener('click', () => openDetailModal(post));
                galleryGrid.appendChild(card);
            });
        }

        window.openDetailModal = function(post) {
            const modal = document.getElementById('detailModal');
            const modalBody = document.getElementById('modalBody');

            let anglesHtml = "";
            let pairs = post.imagePromptPairs || [];
            
            if (pairs.length === 0 && post.imageUrls) {
                pairs = post.imageUrls.map(url => ({ imageUrl: url, prompt: post.promptText || "Detailed shot" }));
            }

            pairs.forEach((pair, index) => {
                anglesHtml += `
                    <div class="bg-zinc-950 border border-zinc-800 p-3 rounded-2xl space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="text-[11px] font-bold text-amber-400"><i class="fa-solid fa-camera mr-1"></i> Angle ${index + 1}</span>
                        </div>
                        <img src="${pair.imageUrl}" class="w-full h-72 object-cover rounded-xl border border-zinc-800">
                        <div class="bg-zinc-900 p-3 rounded-xl border border-zinc-800 space-y-2">
                            <p class="text-xs text-zinc-300 font-mono select-all leading-relaxed">${pair.prompt}</p>
                            <button onclick="navigator.clipboard.writeText(` + "`" + `${pair.prompt}` + "`" + `); alert('Angle ${index + 1} prompt copied successfully!');" class="w-full bg-amber-400 hover:bg-amber-500 text-zinc-950 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-2 cursor-pointer shadow-md">
                                <i class="fa-regular fa-copy text-sm"></i>
                                <span>Copy Prompt (Angle ${index + 1})</span>
                            </button>
                        </div>
                    </div>
                `;
            });

            let suggestions = allPosts.filter(p => p.category === post.category && p.id !== post.id).slice(0, 4);
            let suggestedHtml = "";

            if (suggestions.length > 0) {
                suggestions.forEach(sug => {
                    let sugThumb = sug.imagePromptPairs?.[0]?.imageUrl || sug.imageUrls?.[0] || "";
                    suggestedHtml += `
                        <div data-id="${sug.id}" class="suggestion-card flex-shrink-0 w-28 bg-zinc-950 border border-zinc-800 rounded-xl overflow-hidden cursor-pointer group">
                            <img src="${sugThumb}" class="w-full h-20 object-cover group-hover:scale-105 transition">
                            <p class="text-[10px] text-zinc-300 p-1.5 truncate">${sug.title}</p>
                        </div>
                    `;
                });
            } else {
                suggestedHtml = `<p class="text-xs text-zinc-500 py-2">No other suggestions in this category yet.</p>`;
            }

            modalBody.innerHTML = `
                <div>
                    <h2 class="text-base font-bold text-white">${post.title}</h2>
                    <span class="text-xs text-amber-400 bg-amber-400/10 px-2.5 py-0.5 rounded-full inline-block mt-1">${post.category}</span>
                </div>

                <!-- Angles Stack Container with Copy Buttons -->
                <div class="space-y-4 max-h-[50vh] overflow-y-auto pr-1">
                    ${anglesHtml}
                </div>

                <!-- Suggested Prompts Section -->
                <div class="pt-2 border-t border-zinc-800">
                    <h4 class="text-xs font-semibold text-zinc-400 mb-2">Suggested Prompts</h4>
                    <div id="suggestionsContainer" class="flex space-x-2 overflow-x-auto pb-2">
                        ${suggestedHtml}
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');

            setTimeout(() => {
                document.querySelectorAll('.suggestion-card').forEach(el => {
                    const sid = el.getAttribute('data-id');
                    el.addEventListener('click', () => {
                        const targetPost = allPosts.find(p => p.id === sid);
                        if (targetPost) openDetailModal(targetPost);
                    });
                });
            }, 100);
        }

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            document.getElementById('detailModal').classList.add('hidden');
        });

        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target.id === 'detailModal') {
                document.getElementById('detailModal').classList.add('hidden');
            }
        });

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const filtered = allPosts.filter(p => 
                p.title.toLowerCase().includes(term) || 
                p.category.toLowerCase().includes(term)
            );
            renderGallery(filtered);
        });
    </script>
</body>
</html>
