<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptGenz - AI Image Prompts</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-zinc-950 text-white font-sans pb-24">

    <!-- Header Section (Upload button removed for security/privacy) -->
    <header class="flex items-center justify-between px-4 py-3 sticky top-0 bg-zinc-950/85 backdrop-blur-md z-50 border-b border-zinc-900">
        <h1 class="text-xl font-bold tracking-wide text-amber-400">PromptGenz</h1>
        <div class="flex items-center space-x-2.5">
            <div class="w-9 h-9 bg-zinc-800 rounded-full flex items-center justify-center overflow-hidden border border-zinc-700">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Profile" class="w-full h-full object-cover">
            </div>
        </div>
    </header>

    <!-- Search Bar -->
    <div class="px-4 my-3">
        <div class="flex items-center bg-zinc-900 border border-zinc-800 rounded-full px-4 py-3 text-zinc-400 shadow-inner">
            <i class="fa-solid fa-magnifying-glass mr-3 text-sm text-zinc-500"></i>
            <input type="text" placeholder="Search prompts, tags, themes..." class="bg-transparent border-none outline-none text-white w-full text-sm placeholder-zinc-500">
        </div>
    </div>

    <!-- Gallery Section (Loaded live from Firebase) -->
    <div class="px-4 mt-6">
        <div class="flex justify-between items-center mb-3">
            <h3 class="text-lg font-bold">Live Gallery</h3>
            <span class="text-xs text-amber-400 flex items-center"><i class="fa-solid fa-bolt mr-1"></i> Real-time sync</span>
        </div>
        <div id="galleryGrid" class="grid grid-cols-2 gap-3">
            <!-- Loading indicator initially -->
            <div class="col-span-2 text-center py-10 text-zinc-500 text-xs">
                <i class="fa-solid fa-spinner animate-spin text-amber-400 text-lg mb-2"></i>
                <p>Loading live prompts from cloud...</p>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-zinc-950/90 backdrop-blur-lg border-t border-zinc-900 px-6 py-3 flex justify-between items-center z-50">
        <a href="#" class="text-amber-400 flex flex-col items-center"><i class="fa-solid fa-house text-lg"></i></a>
        <a href="#" class="text-zinc-500 flex flex-col items-center"><i class="fa-solid fa-compass text-lg"></i></a>
        <a href="#" class="text-zinc-500 flex flex-col items-center"><i class="fa-regular fa-heart text-lg"></i></a>
        <a href="#" class="text-zinc-500 flex flex-col items-center"><i class="fa-regular fa-user text-lg"></i></a>
    </nav>

    <!-- Firebase SDK & Fetch Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAcyASMFEogpp8BwgJc4hsPGNoIZOb6dKo",
            authDomain: "promptgenz-daaf3.firebaseapp.com",
            projectId: "promptgenz-daaf3",
            storageBucket: "promptgenz-daaf3.firebasestorage.app",
            messagingSenderId: "751005531769",
            appId: "1:751005531769:web:20b8330970e001dd691ea8",
            measurementId: "G-VF4QP1SLSQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addEventListener('DOMContentLoaded', async () => {
            const galleryGrid = document.getElementById('galleryGrid');
            
            try {
                const q = query(collection(db, "prompts"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                galleryGrid.innerHTML = ""; 

                if (querySnapshot.empty) {
                    galleryGrid.innerHTML = `<div class="col-span-2 text-center py-10 text-zinc-500 text-xs">No prompts uploaded yet.</div>`;
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const item = doc.data();
                    const card = document.createElement('div');
                    card.className = 'relative rounded-2xl overflow-hidden bg-zinc-900 border border-zinc-800 h-64 group cursor-pointer shadow-lg';
                    card.innerHTML = `
                        <img src="${item.imageUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        <div class="absolute inset-0 bg-gradient-to-t from-zinc-950/90 via-zinc-950/20 to-transparent opacity-0 group-hover:opacity-100 transition flex flex-col justify-end p-3.5">
                            <span class="text-xs font-bold text-white truncate">${item.title}</span>
                            <span class="text-[10px] text-amber-400 mt-0.5">${item.category}</span>
                            <span class="text-[9px] text-zinc-400 mt-1 bg-zinc-900/80 px-2 py-1 rounded border border-zinc-800">Tap to copy prompt</span>
                        </div>
                        <button class="absolute top-3 right-3 bg-black/50 backdrop-blur-md p-2 rounded-full text-white">
                            <i class="fa-regular fa-heart text-xs"></i>
                        </button>
                    `;
                    
                    card.addEventListener('click', () => {
                        navigator.clipboard.writeText(item.promptText);
                        alert(`Copied Prompt: "${item.title}"`);
                    });

                    galleryGrid.appendChild(card);
                });
            } catch (error) {
                console.error("Error fetching prompts: ", error);
                galleryGrid.innerHTML = `<div class="col-span-2 text-center py-10 text-red-400 text-xs">Failed to load live prompts.</div>`;
            }
        });
    </script>
</body>
</html>
