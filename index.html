<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptGenZ - AI Prompt Gallery</title>
    <!-- Local Favicon Integration -->
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-zinc-950 text-white font-sans min-h-screen pb-24">

    <!-- Top Header with Logo -->
    <header class="p-4 flex items-center justify-between sticky top-0 bg-zinc-950/80 backdrop-blur-md z-30">
        <div class="flex items-center space-x-2.5 cursor-pointer" onclick="switchTab('home'); updateNavActive(document.getElementById('navHomeBtn'))">
            <img src="logo.png" alt="PromptGenZ Logo" class="w-9 h-9 rounded-xl object-cover shadow-md border border-zinc-800" onerror="this.src='https://via.placeholder.com/150/18181b/71717a?text=Logo'">
            <span class="text-base font-extrabold tracking-wide bg-gradient-to-r from-white via-zinc-200 to-zinc-400 bg-clip-text text-transparent">PromptGenZ</span>
        </div>
        <div class="flex items-center space-x-3">
            <div onclick="openProfileModal(); updateNavActive(document.getElementById('navProfileBtn'))" class="w-8 h-8 rounded-full bg-zinc-900 border border-zinc-800 overflow-hidden flex items-center justify-center cursor-pointer hover:border-amber-400 transition">
                <i class="fa-solid fa-user text-zinc-400 text-xs"></i>
            </div>
        </div>
    </header>

    <!-- Search Bar -->
    <div class="px-4 pb-3">
        <div class="relative bg-zinc-900/90 border border-zinc-800/80 rounded-2xl flex items-center px-4 py-3 focus-within:border-amber-400 transition">
            <i class="fa-solid fa-magnifying-glass text-zinc-500 mr-3 text-sm"></i>
            <input type="text" id="searchInput" placeholder="Search prompts, tags, themes..." class="bg-transparent border-none outline-none text-white w-full text-sm placeholder-zinc-600">
        </div>
    </div>

    <!-- Featured Carousel Section -->
    <section class="px-4 mb-6">
        <div class="flex items-center justify-between mb-3">
            <div>
                <h2 class="text-sm font-bold text-white">Featured</h2>
                <p class="text-[10px] text-zinc-400">Newly uploaded fresh prompts</p>
            </div>
        </div>
        <div id="featuredCarousel" class="flex space-x-3 overflow-x-auto scrollbar-none snap-x snap-mandatory pb-2">
            <!-- Dynamic Featured Cards -->
        </div>
    </section>

    <!-- Adsterra Banner Ad Space -->
    <div class="px-4 mb-6">
        <div class="w-full bg-zinc-900/40 border border-zinc-800/60 rounded-2xl p-2 min-h-[90px] flex flex-col items-center justify-center text-center overflow-hidden">
            <span class="text-[9px] text-zinc-600 uppercase tracking-widest mb-1">Advertisement</span>
            <div class="text-xs text-zinc-500 w-full flex justify-center">
                <script async="async" data-cfasync="false" src="https://pl30976426.profitableratecpmnetwork.com/9fc8c4f618a6435594dfee7d8598be59/invoke.js"></script>
                <div id="container-9fc8c4f618a6435594dfee7d8598be59"></div>
            </div>
        </div>
    </div>

    <!-- Trending Now Section -->
    <section class="mb-6">
        <div class="px-4 flex items-center justify-between mb-3">
            <div>
                <h2 id="sectionTitle" class="text-sm font-bold text-white">Trending now</h2>
                <p id="sectionSubtitle" class="text-[10px] text-zinc-400">Most copied & popular prompts</p>
            </div>
        </div>
        <div id="trendingGrid" class="flex space-x-3 overflow-x-auto px-4 scrollbar-none pb-2">
            <!-- Dynamic Trending Cards -->
        </div>
    </section>

    <!-- Live Gallery Section -->
    <main class="px-4">
        <div class="flex items-center justify-between mb-3">
            <h2 id="galleryHeading" class="text-sm font-bold text-white">Gallery</h2>
        </div>

        <!-- Dynamic Category Filter Pills -->
        <div id="categoryPillsContainer" class="flex space-x-2 overflow-x-auto scrollbar-none mb-4 pb-1">
            <button onclick="filterCategory('All')" class="category-pill active bg-white text-zinc-950 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition cursor-pointer flex items-center space-x-1.5 shadow-sm">
                <i class="fa-solid fa-sparkles text-xs"></i><span>All</span>
            </button>
        </div>

        <!-- Gallery Grid -->
        <div id="galleryGrid" class="grid grid-cols-2 gap-3">
            <!-- Dynamic gallery items -->
        </div>
    </main>

    <!-- Prompt Detail Popup Modal -->
    <div id="detailModal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden z-50 flex flex-col justify-end items-center p-0">
        <div class="bg-zinc-950 border-t border-zinc-800 w-full max-w-lg h-[92vh] rounded-t-[32px] overflow-y-auto flex flex-col relative shadow-2xl p-5 space-y-4">
            <button id="closeModalBtn" class="absolute top-5 right-5 bg-zinc-800/80 hover:bg-zinc-700 text-white w-9 h-9 rounded-full flex items-center justify-center z-20 transition cursor-pointer">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
            <div id="modalBody" class="space-y-4 pb-10"></div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profileModal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden z-50 flex flex-col justify-end items-center p-0">
        <div class="bg-zinc-950 border-t border-zinc-800 w-full max-w-lg h-[88vh] rounded-t-[32px] overflow-y-auto flex flex-col relative shadow-2xl p-6 space-y-6">
            <button onclick="closeProfileModal()" class="absolute top-5 right-5 bg-zinc-800/80 hover:bg-zinc-700 text-white w-9 h-9 rounded-full flex items-center justify-center z-20 transition cursor-pointer">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
            <div class="flex items-center space-x-4 pt-2">
                <div class="w-16 h-16 rounded-full bg-zinc-900 border-2 border-amber-400 flex items-center justify-center text-amber-400 text-xl shadow-md">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <h3 id="userNameDisplay" class="text-base font-bold text-white">Guest User</h3>
                    <p id="userStatusDisplay" class="text-xs text-zinc-400">Free Plan</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-zinc-950/90 backdrop-blur-md border-t border-zinc-900 px-8 py-3 flex justify-around items-center z-30 max-w-md mx-auto rounded-t-3xl">
        <button id="navHomeBtn" onclick="switchTab('home'); updateNavActive(this)" class="nav-item text-white flex flex-col items-center bg-transparent border-none cursor-pointer p-1"><i class="fa-solid fa-house text-base"></i></button>
        <button id="navNewBtn" onclick="updateNavActive(this)" class="nav-item relative text-zinc-500 hover:text-zinc-300 flex flex-col items-center bg-transparent border-none cursor-pointer p-1">
            <i class="fa-solid fa-bolt text-base"></i>
            <span class="absolute -top-2 -right-4 bg-red-600 text-white text-[8px] font-bold px-1 rounded-full uppercase tracking-tighter">NEW</span>
        </button>
        <button id="navFavBtn" onclick="switchTab('favorites'); updateNavActive(this)" class="nav-item text-zinc-500 hover:text-zinc-300 flex flex-col items-center bg-transparent border-none cursor-pointer p-1"><i class="fa-solid fa-heart text-base"></i></button>
        <button id="navProfileBtn" onclick="openProfileModal(); updateNavActive(this)" class="nav-item text-zinc-500 hover:text-zinc-300 flex flex-col items-center bg-transparent border-none cursor-pointer p-1"><i class="fa-solid fa-user text-base"></i></button>
    </nav>

    <!-- Script Logic with Debugging -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, query, orderBy, updateDoc, increment } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAcyASMFEogpp8BwgJc4hsPGNoIZOb6dKo",
            authDomain: "promptgenz-daaf3.firebaseapp.com",
            projectId: "promptgenz-daaf3",
            storageBucket: "promptgenz-daaf3.firebasestorage.app",
            messagingSenderId: "751005531769",
            appId: "1:751005531769:web:20b8330970e001dd691ea8",
            measurementId: "G-VF4QP1SLSQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const SMART_LINK = "https://www.profitableratecpmnetwork.com/ihr6udrbmt?key=b60998cdc3712fec0b006bfc89a2bc6b";

        let allPosts = [];
        let currentTab = 'home';

        window.addEventListener('DOMContentLoaded', fetchGalleryData);

        async function fetchGalleryData() {
            const galleryGrid = document.getElementById('galleryGrid');
            galleryGrid.innerHTML = '<div class="col-span-2 text-center py-10 text-xs text-zinc-500"><i class="fa-solid fa-spinner animate-spin mr-1"></i> Loading prompts...</div>';

            try {
                let querySnapshot;
                try {
                    const q = query(collection(db, "prompts"), orderBy("createdAt", "desc"));
                    querySnapshot = await getDocs(q);
                } catch (indexErr) {
                    console.warn("OrderBy failed, fetching without sorting:", indexErr);
                    querySnapshot = await getDocs(collection(db, "prompts"));
                }

                allPosts = [];
                querySnapshot.forEach((docSnap) => {
                    let data = docSnap.data();
                    allPosts.push({ id: docSnap.id, ...data });
                });
                
                renderCategoryPills(allPosts);
                renderFeaturedCarousel(allPosts);
                renderTrendingSection(allPosts);
                renderGallery(allPosts);
            } catch (error) {
                console.error("Error fetching data from Firebase:", error);
                galleryGrid.innerHTML = `<div class="col-span-2 text-center py-10 text-xs text-red-400">Failed to load items: ${error.message}</div>`;
            }
        }

        window.switchTab = function(tab) {
            currentTab = tab;
            const featuredSec = document.querySelector('section.px-4.mb-6:has(#featuredCarousel)');
            const trendingSec = document.querySelector('section.mb-6:has(#trendingGrid)');
            const catContainer = document.getElementById('categoryPillsContainer');
            const galleryHeading = document.getElementById('galleryHeading');

            if (tab === 'favorites') {
                if (featuredSec) featuredSec.style.display = 'none';
                if (trendingSec) trendingSec.style.display = 'none';
                if (catContainer) catContainer.style.display = 'none';
                galleryHeading.textContent = "My Saved Favorites";
                renderFavorites();
            } else {
                if (featuredSec) featuredSec.style.display = 'block';
                if (trendingSec) trendingSec.style.display = 'block';
                if (catContainer) catContainer.style.display = 'flex';
                galleryHeading.textContent = "Gallery";
                renderGallery(allPosts);
            }
        }

        window.updateNavActive = function(element) {
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.remove('text-white');
                btn.classList.add('text-zinc-500');
            });
            element.classList.remove('text-zinc-500');
            element.classList.add('text-white');
        }

        function getThumbnail(post) {
            if (!post) return 'https://via.placeholder.com/400x500/18181b/71717a?text=No+Image';

            if (Array.isArray(post.imagePromptPairs) && post.imagePromptPairs.length > 0) {
                let first = post.imagePromptPairs[0];
                if (typeof first === 'object' && first !== null) {
                    return first.imageUrl || first.image || first.url || first.img || 'https://via.placeholder.com/400x500/18181b/71717a?text=No+Image';
                } else if (typeof first === 'string') {
                    return first;
                }
            }

            if (Array.isArray(post.imageUrls) && post.imageUrls.length > 0) {
                return post.imageUrls[0];
            }

            return post.imageUrl || post.image || post.photoUrl || post.img || post.url || 'https://via.placeholder.com/400x500/18181b/71717a?text=No+Image';
        }

        function renderCategoryPills(posts) {
            const container = document.getElementById('categoryPillsContainer');
            let html = `
                <button onclick="filterCategory('All')" class="category-pill active bg-white text-zinc-950 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition cursor-pointer flex items-center space-x-1.5 shadow-sm">
                    <i class="fa-solid fa-sparkles text-xs"></i><span>All</span>
                </button>
            `;
            const categories = [...new Set(posts.map(p => p.category).filter(Boolean))];
            categories.forEach(cat => {
                html += `
                    <button onclick="filterCategory('${cat}')" class="category-pill bg-zinc-900 border border-zinc-800 text-zinc-300 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition cursor-pointer flex items-center space-x-1.5">
                        <i class="fa-solid fa-tag text-xs"></i><span>${cat}</span>
                    </button>
                `;
            });
            container.innerHTML = html;
        }

        function renderFeaturedCarousel(posts) {
            const container = document.getElementById('featuredCarousel');
            container.innerHTML = "";
            if (posts.length === 0) return;

            posts.slice(0, 5).forEach((post) => {
                let thumb = getThumbnail(post);
                const card = document.createElement('div');
                card.className = "flex-shrink-0 w-[280px] sm:w-[320px] h-[380px] rounded-[28px] overflow-hidden relative shadow-xl snap-start cursor-pointer group bg-zinc-900 border border-zinc-800";
                card.innerHTML = `
                    <img src="${thumb}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.src='https://via.placeholder.com/400x500/18181b/71717a?text=Image+Error'">
                    <div class="absolute inset-0 bg-gradient-to-t from-zinc-950/90 via-transparent to-transparent flex flex-col justify-between p-5">
                        <div>
                            <span class="inline-flex items-center px-3 py-1 rounded-full text-[10px] font-semibold tracking-wider bg-amber-500/90 text-zinc-950 font-bold border border-amber-400 backdrop-blur-md shadow-lg">
                                ★ NEW UPLOAD
                            </span>
                        </div>
                        <div class="space-y-1">
                            <h3 class="text-base font-bold text-white leading-snug drop-shadow">${post.title || "Untitled"}</h3>
                            <p class="text-xs text-zinc-300 font-medium">${post.category || "General"}</p>
                        </div>
                    </div>
                `;
                card.addEventListener('click', () => openDetailModal(post));
                container.appendChild(card);
            });
        }

        function renderTrendingSection(posts) {
            const container = document.getElementById('trendingGrid');
            container.innerHTML = "";
            if (posts.length === 0) return;

            let trendingPosts = [...posts].sort((a, b) => (b.copyCount || 0) - (a.copyCount || 0));
            trendingPosts.slice(0, 10).forEach((post, index) => {
                let thumb = getThumbnail(post);
                const card = document.createElement('div');
                card.className = "flex-shrink-0 w-32 bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-lg relative group cursor-pointer flex flex-col";
                card.innerHTML = `
                    <div class="relative w-full h-40 bg-zinc-950 overflow-hidden">
                        <img src="${thumb}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/200/18181b/71717a?text=Error'">
                        <span class="absolute top-2 left-2 bg-red-600/95 backdrop-blur-md text-white text-[10px] font-bold px-2 py-0.5 rounded-lg border border-white/10 shadow">
                            🔥 #${index + 1}
                        </span>
                    </div>
                    <div class="p-2.5 flex flex-col justify-between flex-1">
                        <h3 class="text-[11px] font-semibold text-white truncate">${post.title || "Untitled"}</h3>
                        <p class="text-[9px] text-zinc-400 mt-0.5 truncate">${post.copyCount || 0} uses</p>
                    </div>
                `;
                card.addEventListener('click', () => openDetailModal(post));
                container.appendChild(card);
            });
        }

        window.filterCategory = function(cat) {
            document.querySelectorAll('.category-pill').forEach(btn => {
                if(btn.textContent.trim().includes(cat)) {
                    btn.className = "category-pill active bg-white text-zinc-950 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition cursor-pointer flex items-center space-x-1.5 shadow-sm";
                } else {
                    btn.className = "category-pill bg-zinc-900 border border-zinc-800 text-zinc-300 px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition cursor-pointer flex items-center space-x-1.5";
                }
            });

            if (cat === 'All') {
                renderGallery(allPosts);
            } else {
                const filtered = allPosts.filter(p => p.category && p.category.toLowerCase() === cat.toLowerCase());
                renderGallery(filtered);
            }
        }

        function renderGallery(posts) {
            const galleryGrid = document.getElementById('galleryGrid');
            galleryGrid.innerHTML = "";

            if (posts.length === 0) {
                galleryGrid.innerHTML = '<div class="col-span-2 text-center py-10 text-xs text-zinc-500">No prompts found.</div>';
                return;
            }

            posts.forEach(post => {
                let thumb = getThumbnail(post);
                const card = document.createElement('div');
                card.className = "bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-lg relative group cursor-pointer flex flex-col";
                card.innerHTML = `
                    <div class="relative w-full h-56 bg-zinc-950 overflow-hidden">
                        <img src="${thumb}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/300/18181b/71717a?text=Error'">
                    </div>
                    <div class="p-3 flex flex-col justify-between flex-1">
                        <h3 class="text-xs font-semibold text-white truncate">${post.title || "Untitled"}</h3>
                        <p class="text-[10px] text-zinc-400 mt-1">${post.category || "General"}</p>
                    </div>
                `;
                card.addEventListener('click', () => openDetailModal(post));
                galleryGrid.appendChild(card);
            });
        }

        function renderFavorites() {
            const galleryGrid = document.getElementById('galleryGrid');
            galleryGrid.innerHTML = "";
            let savedFavs = JSON.parse(localStorage.getItem('promptgenz_favorites') || '[]');
            
            if (savedFavs.length === 0) {
                galleryGrid.innerHTML = '<div class="col-span-2 text-center py-10 text-xs text-zinc-500">No saved favorites yet.</div>';
                return;
            }

            savedFavs.forEach(post => {
                let thumb = getThumbnail(post);
                const card = document.createElement('div');
                card.className = "bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-lg relative group cursor-pointer flex flex-col";
                card.innerHTML = `
                    <div class="relative w-full h-56 bg-zinc-950 overflow-hidden">
                        <img src="${thumb}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/300/18181b/71717a?text=Error'">
                    </div>
                    <div class="p-3 flex flex-col justify-between flex-1">
                        <h3 class="text-xs font-semibold text-white truncate">${post.title || "Untitled"}</h3>
                        <p class="text-[10px] text-zinc-400 mt-1">${post.category || "General"}</p>
                    </div>
                `;
                card.addEventListener('click', () => openDetailModal(post));
                galleryGrid.appendChild(card);
            });
        }

        window.openDetailModal = function(post) {
            const modal = document.getElementById('detailModal');
            const modalBody = document.getElementById('modalBody');

            let pairs = [];
            if (Array.isArray(post.imagePromptPairs) && post.imagePromptPairs.length > 0) {
                pairs = post.imagePromptPairs.map(p => {
                    if (typeof p === 'string') {
                        return { imageUrl: p, prompt: post.promptText || post.prompt || "Detailed prompt" };
                    }
                    return {
                        imageUrl: p.imageUrl || p.image || p.url || p.img || '',
                        prompt: p.prompt || post.promptText || post.prompt || "Detailed prompt"
                    };
                });
            } else {
                let singleImg = getThumbnail(post);
                pairs = [{ imageUrl: singleImg, prompt: post.promptText || post.prompt || post.promptContent || "Detailed prompt" }];
            }

            let currentMainImage = pairs[0]?.imageUrl || "";
            let currentPromptText = pairs[0]?.prompt || "";

            let horizontalAnglesHtml = "";
            if (pairs.length > 1) {
                pairs.forEach((pair, idx) => {
                    let isFirst = idx === 0;
                    let safePrompt = (pair.prompt || "").replace(/["`]/g, "'");
                    horizontalAnglesHtml += `
                        <div onclick="updateModalMainImage('${pair.imageUrl}', \`${safePrompt}\`, this)" class="angle-thumb flex-shrink-0 w-20 h-20 rounded-xl overflow-hidden border-2 ${isFirst ? 'border-white' : 'border-zinc-800'} cursor-pointer transition hover:opacity-80">
                            <img src="${pair.imageUrl}" class="w-full h-full object-cover">
                        </div>
                    `;
                });
            }

            let suggestedPosts = allPosts.filter(p => p.id !== post.id && p.category === post.category).slice(0, 6);
            if (suggestedPosts.length === 0) suggestedPosts = allPosts.filter(p => p.id !== post.id).slice(0, 6);

            let suggestedHtml = "";
            suggestedPosts.forEach(sPost => {
                let sThumb = getThumbnail(sPost);
                suggestedHtml += `
                    <div onclick="openDetailModalFromSuggestion('${sPost.id}')" class="flex-shrink-0 w-28 bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-md cursor-pointer group flex flex-col">
                        <div class="w-full h-28 bg-zinc-950 overflow-hidden">
                            <img src="${sThumb}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        </div>
                        <div class="p-2">
                            <h4 class="text-[10px] font-semibold text-white truncate">${sPost.title || "Untitled"}</h4>
                        </div>
                    </div>
                `;
            });

            let savedFavs = JSON.parse(localStorage.getItem('promptgenz_favorites') || '[]');
            let isFav = savedFavs.some(p => p.id === post.id);

            modalBody.innerHTML = `
                <div class="w-full h-[280px] bg-zinc-900 rounded-[24px] overflow-hidden border border-zinc-800 shadow-xl relative flex items-center justify-center p-2">
                    <img id="activeModalImage" src="${currentMainImage}" class="w-full h-full object-contain">
                </div>

                ${pairs.length > 1 ? `
                <div class="space-y-1.5">
                    <span class="text-[10px] text-zinc-400 font-semibold uppercase tracking-wider">Select Angle</span>
                    <div id="anglesContainer" class="flex space-x-2 overflow-x-auto pb-1 scrollbar-none">
                        ${horizontalAnglesHtml}
                    </div>
                </div>` : ''}

                <div class="flex items-center justify-between">
                    <h2 class="text-base font-bold text-white leading-snug">${post.title || "Untitled"}</h2>
                    <button id="modalFavBtn" class="w-10 h-10 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-sm cursor-pointer hover:border-amber-400 transition">
                        <i class="fa-${isFav ? 'solid' : 'regular'} fa-heart ${isFav ? 'text-red-500' : 'text-zinc-400'}"></i>
                    </button>
                </div>

                <!-- Prompt Text Box -->
                <div class="relative bg-zinc-900/90 border border-zinc-800 rounded-2xl p-3.5">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-[10px] text-amber-400 font-bold uppercase tracking-wider flex items-center space-x-1">
                            <i class="fa-solid fa-terminal"></i><span>Prompt Text</span>
                        </span>
                        <span class="text-[9px] text-zinc-500">Tap copy to generate</span>
                    </div>
                    <textarea id="promptTextBox" readonly class="w-full h-16 bg-transparent text-xs text-zinc-300 outline-none resize-none scrollbar-none font-mono" placeholder="Click copy below...">${currentPromptText}</textarea>
                </div>

                <!-- Action Buttons -->
                <div class="flex space-x-3 pt-1">
                    <button id="copyPromptBtn" class="flex-1 bg-white hover:bg-zinc-200 text-zinc-950 py-3.5 rounded-2xl text-sm font-bold transition flex items-center justify-center space-x-2 shadow-lg cursor-pointer">
                        <i class="fa-regular fa-copy"></i>
                        <span>Copy Prompt</span>
                    </button>
                </div>

                <!-- Suggested Prompts Section -->
                ${suggestedPosts.length > 0 ? `
                <div class="space-y-2 pt-2 border-t border-zinc-900">
                    <h3 class="text-xs font-bold text-white tracking-wide">You might also like</h3>
                    <div class="flex space-x-3 overflow-x-auto pb-2 scrollbar-none">
                        ${suggestedHtml}
                    </div>
                </div>` : ''}
            `;

            // Favorite Logic
            document.getElementById('modalFavBtn').onclick = function() {
                let favs = JSON.parse(localStorage.getItem('promptgenz_favorites') || '[]');
                let index = favs.findIndex(p => p.id === post.id);
                const icon = this.querySelector('i');
                
                if (index > -1) {
                    favs.splice(index, 1);
                    icon.className = "fa-regular fa-heart text-zinc-400";
                } else {
                    favs.push(post);
                    icon.className = "fa-solid fa-heart text-red-500";
                }
                localStorage.setItem('promptgenz_favorites', JSON.stringify(favs));
                if (currentTab === 'favorites') renderFavorites();
            };

            // Copy & Typing Effect Logic with Smart Link
            document.getElementById('copyPromptBtn').onclick = async function() {
                navigator.clipboard.writeText(currentPromptText);
                window.open(SMART_LINK, '_blank');

                const textBox = document.getElementById('promptTextBox');
                textBox.value = "";
                let i = 0;
                function typeWriter() {
                    if (i < currentPromptText.length) {
                        textBox.value += currentPromptText.charAt(i);
                        i++;
                        setTimeout(typeWriter, 10);
                    }
                }
                typeWriter();

                post.copyCount = (post.copyCount || 0) + 1;
                try {
                    const postRef = doc(db, "prompts", post.id);
                    await updateDoc(postRef, { copyCount: increment(1) });
                } catch (err) {
                    console.error("Could not update copy count:", err);
                }
            };

            modal.classList.remove('hidden');
        }

        window.openDetailModalFromSuggestion = function(postId) {
            const foundPost = allPosts.find(p => p.id === postId);
            if (foundPost) {
                openDetailModal(foundPost);
                document.getElementById('detailModal').scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        window.updateModalMainImage = function(imageUrl, promptText, element) {
            document.getElementById('activeModalImage').src = imageUrl;
            document.getElementById('promptTextBox').value = promptText;
            document.querySelectorAll('.angle-thumb').forEach(thumb => {
                thumb.classList.remove('border-white');
                thumb.classList.add('border-zinc-800');
            });
            element.classList.remove('border-zinc-800');
            element.classList.add('border-white');
        }

        window.openProfileModal = () => document.getElementById('profileModal').classList.remove('hidden');
        window.closeProfileModal = () => document.getElementById('profileModal').classList.add('hidden');

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            document.getElementById('detailModal').classList.add('hidden');
        });

        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target.id === 'detailModal') document.getElementById('detailModal').classList.add('hidden');
        });

        document.getElementById('profileModal').addEventListener('click', (e) => {
            if (e.target.id === 'profileModal') document.getElementById('profileModal').classList.add('hidden');
        });

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const filtered = allPosts.filter(p => 
                (p.title && p.title.toLowerCase().includes(term)) || 
                (p.category && p.category.toLowerCase().includes(term))
            );
            renderGallery(filtered);
        });
    </script>
</body>
</html>
