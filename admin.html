<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptGenz - Admin Panel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white font-sans min-h-screen p-4 sm:p-8 flex flex-col justify-center items-center">

    <div class="w-full max-w-2xl bg-zinc-900 border border-zinc-800 rounded-3xl p-6 shadow-2xl my-6">
        <!-- Header -->
        <div class="flex items-center justify-between pb-5 border-b border-zinc-800 mb-6">
            <div>
                <h1 class="text-xl font-bold text-amber-400">PromptGenz Admin</h1>
                <p class="text-xs text-zinc-400 mt-1">Manage API Key, Categories & Multi-Angle Prompts</p>
            </div>
            <a href="index.html" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-4 py-2 rounded-xl text-xs font-medium transition flex items-center space-x-2">
                <i class="fa-solid fa-arrow-left"></i>
                <span>View Site</span>
            </a>
        </div>

        <!-- API Key Setup Section -->
        <div class="mb-6 bg-zinc-950 border border-zinc-800 p-4 rounded-2xl">
            <label class="block text-xs font-semibold text-amber-400 mb-1.5"><i class="fa-solid fa-key mr-1"></i> Gemini API Key Setup</label>
            <div class="flex space-x-2">
                <input type="password" id="apiKeyInput" placeholder="Paste your Gemini API key here..." class="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white placeholder-zinc-600 outline-none focus:border-amber-400">
                <button type="button" id="saveApiKeyBtn" class="bg-amber-400 text-zinc-950 px-4 py-2 rounded-xl text-xs font-bold hover:bg-amber-500 transition">Save Key</button>
            </div>
            <p id="apiKeyStatus" class="text-[10px] text-zinc-500 mt-1.5">API Key is required to auto-generate prompts.</p>
        </div>

        <!-- Upload Form -->
        <form id="uploadForm" class="space-y-4">
            <!-- Multiple Image File Upload -->
            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1.5">Select Images (Multiple Angles allowed)</label>
                <div class="flex flex-col items-center justify-center border-2 border-dashed border-zinc-800 hover:border-amber-400/50 rounded-2xl p-6 bg-zinc-950 transition cursor-pointer relative overflow-hidden group">
                    <input type="file" id="imageFiles" accept="image/*" multiple required class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-20">
                    <div id="uploadPrompt" class="text-center">
                        <i class="fa-solid fa-images text-3xl text-amber-400 mb-2 group-hover:scale-110 transition"></i>
                        <p class="text-xs text-zinc-300 font-medium">Click to upload multiple angle photos</p>
                        <p class="text-[10px] text-zinc-500 mt-1">Select 1 or more images together</p>
                    </div>
                </div>
            </div>

            <!-- Dynamic Prompts Per Image Container -->
            <div id="perImagePromptsSection" class="hidden space-y-4">
                <label class="block text-xs font-semibold text-amber-400">Customize Prompt for Each Angle/Image</label>
                <div id="imagePromptPairsContainer" class="space-y-3">
                    <!-- Dynamically injected image-prompt pairs -->
                </div>
            </div>

            <!-- Title -->
            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1.5">Main Post Title</label>
                <div class="flex items-center bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-3 focus-within:border-amber-400 transition">
                    <i class="fa-solid fa-heading text-zinc-500 mr-2 text-sm"></i>
                    <input type="text" id="promptTitle" required placeholder="e.g. Cyberpunk Warrior Set" class="bg-transparent border-none outline-none text-white w-full text-sm placeholder-zinc-600">
                </div>
            </div>

            <!-- Category Selection & New Category Adder -->
            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1.5">Category</label>
                <div class="flex space-x-2">
                    <div class="relative flex-1 bg-zinc-950 border border-zinc-800 rounded-xl focus-within:border-amber-400 transition">
                        <select id="promptCategory" class="w-full bg-transparent border-none outline-none text-white px-3 py-3 text-sm appearance-none cursor-pointer">
                            <!-- Dynamic categories will load here -->
                        </select>
                        <div class="absolute right-3 top-3.5 text-zinc-500 pointer-events-none">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                    <!-- Add Category Button -->
                    <button type="button" id="toggleNewCatBtn" class="bg-zinc-800 hover:bg-zinc-700 text-amber-400 px-4 rounded-xl text-xs font-medium transition flex items-center space-x-1">
                        <i class="fa-solid fa-plus"></i>
                        <span>New</span>
                    </button>
                </div>

                <!-- Hidden Input to Create New Category -->
                <div id="newCategoryBox" class="hidden mt-2 flex space-x-2">
                    <input type="text" id="newCategoryInput" placeholder="Enter new category name..." class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white placeholder-zinc-600 outline-none focus:border-amber-400">
                    <button type="button" id="saveNewCatBtn" class="bg-amber-400 text-zinc-950 px-3 py-2 rounded-xl text-xs font-bold hover:bg-amber-500 transition">Save</button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-amber-400 hover:bg-amber-500 text-zinc-950 font-bold py-3.5 rounded-xl transition text-sm flex items-center justify-center space-x-2 shadow-lg shadow-amber-400/10">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span>Publish to Cloud</span>
            </button>
        </form>

        <!-- Success Alert -->
        <div id="successAlert" class="hidden mt-4 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 p-3.5 rounded-xl text-xs flex items-center space-x-2 animate-pulse">
            <i class="fa-solid fa-circle-check text-base"></i>
            <span>Successfully uploaded with individual angles & prompts!</span>
        </div>
    </div>

    <!-- Firebase & Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, setDoc, doc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAcyASMFEogpp8BwgJc4hsPGNoIZOb6dKo",
            authDomain: "promptgenz-daaf3.firebaseapp.com",
            projectId: "promptgenz-daaf3",
            storageBucket: "promptgenz-daaf3.firebasestorage.app",
            messagingSenderId: "751005531769",
            appId: "1:751005531769:web:20b8330970e001dd691ea8",
            measurementId: "G-VF4QP1SLSQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let uploadedImageFiles = [];
        let compressedImagesCache = [];

        const apiKeyInput = document.getElementById('apiKeyInput');
        const apiKeyStatus = document.getElementById('apiKeyStatus');

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                apiKeyInput.value = savedKey;
                apiKeyStatus.innerHTML = '<span class="text-emerald-400"><i class="fa-solid fa-check-circle mr-1"></i> API Key loaded from browser storage.</span>';
            }
            loadCategories();
        });

        document.getElementById('saveApiKeyBtn').addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (!key) {
                alert("Please enter a valid API key!");
                return;
            }
            localStorage.setItem('gemini_api_key', key);
            apiKeyStatus.innerHTML = '<span class="text-emerald-400"><i class="fa-solid fa-check-circle mr-1"></i> API Key saved successfully!</span>';
            alert("API Key saved securely!");
        });

        async function loadCategories() {
            const categorySelect = document.getElementById('promptCategory');
            categorySelect.innerHTML = '<option value="" disabled selected>Loading categories...</option>';
            
            try {
                const querySnapshot = await getDocs(collection(db, "categories"));
                categorySelect.innerHTML = "";
                
                if (querySnapshot.empty) {
                    const defaults = ["Portraits", "Cinematic", "Couple", "Trending"];
                    for (let cat of defaults) {
                        await setDoc(doc(db, "categories", cat), { name: cat });
                        categorySelect.innerHTML += `<option value="${cat}">${cat}</option>`;
                    }
                } else {
                    querySnapshot.forEach((docSnap) => {
                        const catName = docSnap.data().name;
                        categorySelect.innerHTML += `<option value="${catName}">${catName}</option>`;
                    });
                }
            } catch (err) {
                console.error("Error loading categories:", err);
                categorySelect.innerHTML = `<option value="Portraits">Portraits</option>`;
            }
        }

        document.getElementById('toggleNewCatBtn').addEventListener('click', () => {
            document.getElementById('newCategoryBox').classList.toggle('hidden');
        });

        document.getElementById('saveNewCatBtn').addEventListener('click', async () => {
            const newCatInput = document.getElementById('newCategoryInput');
            const catName = newCatInput.value.trim();
            if (!catName) return alert("Please enter a category name!");

            try {
                await setDoc(doc(db, "categories", catName), { name: catName });
                
                const categorySelect = document.getElementById('promptCategory');
                const opt = document.createElement('option');
                opt.value = catName;
                opt.textContent = catName;
                categorySelect.appendChild(opt);
                categorySelect.value = catName;

                newCatInput.value = "";
                document.getElementById('newCategoryBox').classList.add('hidden');
                alert(`Category "${catName}" created permanently!`);
            } catch (err) {
                console.error("Error saving category:", err);
                alert("Failed to create category.");
            }
        });

        const compressImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.75));
                    };
                };
            });
        };

        document.getElementById('imageFiles').addEventListener('change', async function(e) {
            const files = e.target.files;
            if (files.length > 0) {
                const currentApiKey = localStorage.getItem('gemini_api_key');
                if (!currentApiKey) {
                    alert("⚠️ Pehle upar apni Gemini API Key daal kar 'Save Key' par click karein!");
                    return;
                }

                uploadedImageFiles = Array.from(files);
                compressedImagesCache = [];
                const container = document.getElementById('imagePromptPairsContainer');
                container.innerHTML = "";
                document.getElementById('perImagePromptsSection').classList.remove('hidden');

                for (let i = 0; i < files.length; i++) {
                    const compressedBase64 = await compressImage(files[i]);
                    compressedImagesCache.push(compressedBase64);

                    const cardId = `angle_card_${i}`;
                    const cardHtml = `
                        <div id="${cardId}" class="bg-zinc-950 border border-zinc-800 p-3 rounded-2xl flex flex-col sm:flex-row gap-3 items-center">
                            <img src="${compressedBase64}" class="w-20 h-20 object-cover rounded-xl border border-zinc-700 flex-shrink-0">
                            <div class="flex-1 w-full space-y-1">
                                <div class="flex justify-between items-center">
                                    <span class="text-[11px] text-zinc-400 font-semibold">Angle ${i + 1} Prompt</span>
                                    <span class="status-indicator text-[10px] text-amber-400"><i class="fa-solid fa-clock mr-1"></i> Waiting...</span>
                                </div>
                                <textarea rows="4" class="angle-prompt-input w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2 text-xs text-white outline-none focus:border-amber-400 resize-y" placeholder="Prompt for this angle..."></textarea>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', cardHtml);
                }

                for (let i = 0; i < compressedImagesCache.length; i++) {
                    await generatePromptForSingleImage(compressedImagesCache[i], `angle_card_${i}`, currentApiKey);
                    if (i < compressedImagesCache.length - 1) {
                        await new Promise(resolve => setTimeout(resolve, 1200));
                    }
                }
            }
        });

        async function uploadImageSafe(file, compressedBase64) {
            try {
                const formData = new FormData();
                formData.append("image", file);
                
                const response = await fetch(`https://api.imgbb.com/1/upload?key=6d207e02c58a93a6a578ec65cb46cfb2`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                if (data && data.success) {
                    return data.data.url;
                }
            } catch (err) {
                console.warn("ImgBB upload issue, using cache fallback.", err);
            }
            return compressedBase64;
        }

        async function generatePromptForSingleImage(base64Data, cardId, apiKey) {
            const card = document.getElementById(cardId);
            const textarea = card.querySelector('.angle-prompt-input');
            const statusSpan = card.querySelector('.status-indicator');

            statusSpan.innerHTML = '<span class="text-amber-400"><i class="fa-solid fa-sparkles animate-spin mr-1"></i> Generating...</span>';

            try {
                const base64Clean = base64Data.split(',')[1];
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Analyze this image angle thoroughly. Write a rich, detailed, multi-line professional AI image generation prompt (at least 3-4 sentences or structured tags). Describe the exact subject, clothing/attire, background architecture or environment, cinematic lighting, shadow details, color grading, camera angle, and aspect ratio (--ar 4:5). Return ONLY the prompt content." },
                                { inline_data: { mime_type: "image/jpeg", data: base64Clean } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    textarea.value = data.candidates[0].content.parts[0].text.trim();
                    statusSpan.innerHTML = '<span class="text-emerald-400"><i class="fa-solid fa-check"></i> Ready</span>';
                } else {
                    textarea.value = "Cinematic portrait shot of a person in traditional outfit, highly detailed architectural background, soft golden hour lighting, sharp focus, professional photography style --ar 4:5";
                    statusSpan.innerHTML = '<span class="text-amber-400">Fallback</span>';
                }
            } catch (error) {
                console.error("AI Error:", error);
                textarea.value = "Cinematic lighting angle shot, beautiful composition, high resolution, detailed clothing and background --ar 4:5";
                statusSpan.innerHTML = '<span class="text-red-400">Failed</span>';
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (uploadedImageFiles.length === 0) {
                alert("Please select at least one image file!");
                return;
            }

            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i><span>Uploading Angles & Publishing...</span>';
            submitBtn.disabled = true;

            try {
                let imagePromptPairs = [];
                const cards = document.querySelectorAll('#imagePromptPairsContainer > div');

                for (let i = 0; i < uploadedImageFiles.length; i++) {
                    let publicUrl = await uploadImageSafe(uploadedImageFiles[i], compressedImagesCache[i]);
                    let anglePromptText = cards[i].querySelector('.angle-prompt-input').value.trim();

                    imagePromptPairs.push({
                        imageUrl: publicUrl,
                        prompt: anglePromptText || "High quality detailed shot --ar 4:5"
                    });
                }

                const newPost = {
                    title: document.getElementById('promptTitle').value,
                    category: document.getElementById('promptCategory',).value,
                    imagePromptPairs: imagePromptPairs,
                    createdAt: Date.now()
                };

                await addDoc(collection(db, "prompts"), newPost);

                const alertBox = document.getElementById('successAlert');
                alertBox.classList.remove('hidden');
                this.reset();
                
                document.getElementById('perImagePromptsSection').classList.add('hidden');
                document.getElementById('imagePromptPairsContainer').innerHTML = "";
                uploadedImageFiles = [];
                compressedImagesCache = [];
                loadCategories();

                setTimeout(() => { alertBox.classList.add('hidden'); }, 3500);
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Failed to upload. Please check your internet connection.");
            } finally {
                submitBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i><span>Publish to Cloud</span>';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
