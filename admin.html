<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptGenz - Admin Panel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white font-sans min-h-screen p-4 sm:p-8 flex flex-col justify-center items-center">

    <div class="w-full max-w-xl bg-zinc-900 border border-zinc-800 rounded-3xl p-6 shadow-2xl my-6">
        <!-- Header -->
        <div class="flex items-center justify-between pb-5 border-b border-zinc-800 mb-6">
            <div>
                <h1 class="text-xl font-bold text-amber-400">PromptGenz Admin</h1>
                <p class="text-xs text-zinc-400 mt-1">Manage API Key, Categories & Prompts</p>
            </div>
            <a href="index.html" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-4 py-2 rounded-xl text-xs font-medium transition flex items-center space-x-2">
                <i class="fa-solid fa-arrow-left"></i>
                <span>View Site</span>
            </a>
        </div>

        <!-- API Key Setup Section -->
        <div class="mb-6 bg-zinc-950 border border-zinc-800 p-4 rounded-2xl">
            <label class="block text-xs font-semibold text-amber-400 mb-1.5"><i class="fa-solid fa-key mr-1"></i> Gemini API Key Setup</label>
            <div class="flex space-x-2">
                <input type="password" id="apiKeyInput" placeholder="Paste your Gemini API key here..." class="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white placeholder-zinc-600 outline-none focus:border-amber-400">
                <button type="button" id="saveApiKeyBtn" class="bg-amber-400 text-zinc-950 px-4 py-2 rounded-xl text-xs font-bold hover:bg-amber-500 transition">Save Key</button>
            </div>
            <p id="apiKeyStatus" class="text-[10px] text-zinc-500 mt-1.5">API Key is saved securely in your browser.</p>
        </div>

        <!-- Upload Form -->
        <form id="uploadForm" class="space-y-4">
            <!-- Multiple Image File Upload -->
            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1.5">Select Images (Multiple Angles allowed)</label>
                <div class="flex flex-col items-center justify-center border-2 border-dashed border-zinc-800 hover:border-amber-400/50 rounded-2xl p-6 bg-zinc-950 transition cursor-pointer relative overflow-hidden group">
                    <input type="file" id="imageFiles" accept="image/*" multiple required class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-20">
                    <div id="uploadPrompt" class="text-center">
                        <i class="fa-solid fa-images text-3xl text-amber-400 mb-2 group-hover:scale-110 transition"></i>
                        <p class="text-xs text-zinc-300 font-medium">Click to upload multiple angle photos</p>
                        <p class="text-[10px] text-zinc-500 mt-1">Select 1 or more images together</p>
                    </div>
                    <!-- Image Previews Container -->
                    <div id="imagePreviewContainer" class="hidden grid grid-cols-3 gap-2 absolute inset-2 bg-zinc-950 p-2 rounded-xl overflow-y-auto z-10"></div>
                </div>
            </div>

            <!-- Title -->
            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1.5">Prompt Title</label>
                <div class="flex items-center bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-3 focus-within:border-amber-400 transition">
                    <i class="fa-solid fa-heading text-zinc-500 mr-2 text-sm"></i>
                    <input type="text" id="promptTitle" required placeholder="e.g. Cyberpunk Warrior" class="bg-transparent border-none outline-none text-white w-full text-sm placeholder-zinc-600">
                </div>
            </div>

            <!-- Category Selection & New Category Adder -->
            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1.5">Category</label>
                <div class="flex space-x-2">
                    <div class="relative flex-1 bg-zinc-950 border border-zinc-800 rounded-xl focus-within:border-amber-400 transition">
                        <select id="promptCategory" class="w-full bg-transparent border-none outline-none text-white px-3 py-3 text-sm appearance-none cursor-pointer">
                            <!-- Dynamic categories will load here -->
                        </select>
                        <div class="absolute right-3 top-3.5 text-zinc-500 pointer-events-none">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                    <!-- Add Category Button -->
                    <button type="button" id="toggleNewCatBtn" class="bg-zinc-800 hover:bg-zinc-700 text-amber-400 px-4 rounded-xl text-xs font-medium transition flex items-center space-x-1">
                        <i class="fa-solid fa-plus"></i>
                        <span>New</span>
                    </button>
                </div>

                <!-- Hidden Input to Create New Category -->
                <div id="newCategoryBox" class="hidden mt-2 flex space-x-2">
                    <input type="text" id="newCategoryInput" placeholder="Enter new category name..." class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white placeholder-zinc-600 outline-none focus:border-amber-400">
                    <button type="button" id="saveNewCatBtn" class="bg-amber-400 text-zinc-950 px-3 py-2 rounded-xl text-xs font-bold hover:bg-amber-500 transition">Save</button>
                </div>
            </div>

            <!-- Exact AI Prompt Text (Auto-Filled by Gemini 3.5) -->
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="text-xs font-semibold text-zinc-300">AI Generation Prompt</label>
                    <span id="aiStatus" class="text-[10px] text-amber-400 hidden"><i class="fa-solid fa-sparkles animate-spin mr-1"></i> Generating prompt with Gemini 3.5...</span>
                </div>
                <textarea id="promptText" rows="4" required placeholder="Upload images above to auto-generate prompt..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-white placeholder-zinc-600 outline-none resize-none focus:border-amber-400 transition"></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-amber-400 hover:bg-amber-500 text-zinc-950 font-bold py-3.5 rounded-xl transition text-sm flex items-center justify-center space-x-2 shadow-lg shadow-amber-400/10">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span>Publish to Cloud</span>
            </button>
        </form>

        <!-- Success Alert -->
        <div id="successAlert" class="hidden mt-4 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 p-3.5 rounded-xl text-xs flex items-center space-x-2 animate-pulse">
            <i class="fa-solid fa-circle-check text-base"></i>
            <span>Successfully uploaded with multiple angles!</span>
        </div>
    </div>

    <!-- Firebase & Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, setDoc, doc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAcyASMFEogpp8BwgJc4hsPGNoIZOb6dKo",
            authDomain: "promptgenz-daaf3.firebaseapp.com",
            projectId: "promptgenz-daaf3",
            storageBucket: "promptgenz-daaf3.firebasestorage.app",
            messagingSenderId: "751005531769",
            appId: "1:751005531769:web:20b8330970e001dd691ea8",
            measurementId: "G-VF4QP1SLSQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let uploadedImagesArray = [];

        const apiKeyInput = document.getElementById('apiKeyInput');
        const apiKeyStatus = document.getElementById('apiKeyStatus');

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                apiKeyInput.value = savedKey;
                apiKeyStatus.innerHTML = '<span class="text-emerald-400"><i class="fa-solid fa-check-circle mr-1"></i> API Key loaded from browser storage.</span>';
            }
            loadCategories();
        });

        document.getElementById('saveApiKeyBtn').addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (!key) {
                alert("Please enter a valid API key!");
                return;
            }
            localStorage.setItem('gemini_api_key', key);
            apiKeyStatus.innerHTML = '<span class="text-emerald-400"><i class="fa-solid fa-check-circle mr-1"></i> API Key saved successfully!</span>';
            alert("API Key saved securely!");
        });

        async function loadCategories() {
            const categorySelect = document.getElementById('promptCategory');
            categorySelect.innerHTML = '<option value="" disabled selected>Loading categories...</option>';
            
            try {
                const querySnapshot = await getDocs(collection(db, "categories"));
                categorySelect.innerHTML = "";
                
                if (querySnapshot.empty) {
                    const defaults = ["Portraits", "Cinematic", "Couple", "Trending"];
                    for (let cat of defaults) {
                        await setDoc(doc(db, "categories", cat), { name: cat });
                        categorySelect.innerHTML += `<option value="${cat}">${cat}</option>`;
                    }
                } else {
                    querySnapshot.forEach((docSnap) => {
                        const catName = docSnap.data().name;
                        categorySelect.innerHTML += `<option value="${catName}">${catName}</option>`;
                    });
                }
            } catch (err) {
                console.error("Error loading categories:", err);
                categorySelect.innerHTML = `<option value="Portraits">Portraits</option>`;
            }
        }

        document.getElementById('toggleNewCatBtn').addEventListener('click', () => {
            document.getElementById('newCategoryBox').classList.toggle('hidden');
        });

        document.getElementById('saveNewCatBtn').addEventListener('click', async () => {
            const newCatInput = document.getElementById('newCategoryInput');
            const catName = newCatInput.value.trim();
            if (!catName) return alert("Please enter a category name!");

            try {
                await setDoc(doc(db, "categories", catName), { name: catName });
                
                const categorySelect = document.getElementById('promptCategory');
                const opt = document.createElement('option');
                opt.value = catName;
                opt.textContent = catName;
                categorySelect.appendChild(opt);
                categorySelect.value = catName;

                newCatInput.value = "";
                document.getElementById('newCategoryBox').classList.add('hidden');
                alert(`Category "${catName}" created permanently!`);
            } catch (err) {
                console.error("Error saving category:", err);
                alert("Failed to create category.");
            }
        });

        document.getElementById('imageFiles').addEventListener('change', async function(e) {
            const files = e.target.files;
            if (files.length > 0) {
                uploadedImagesArray = [];
                const previewContainer = document.getElementById('imagePreviewContainer');
                const uploadPrompt = document.getElementById('uploadPrompt');
                
                previewContainer.innerHTML = "";
                previewContainer.classList.remove('hidden');
                uploadPrompt.classList.add('hidden');

                let firstFileMime = files[0].type;
                let firstBase64 = "";

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const base64 = await toBase64(file);
                    uploadedImagesArray.push(base64);

                    if (i === 0) firstBase64 = base64;

                    const img = document.createElement('img');
                    img.src = base64;
                    img.className = 'w-full h-24 object-cover rounded-lg border border-zinc-700';
                    previewContainer.appendChild(img);
                }

                await generatePromptFromImage(firstBase64, firstFileMime);
            }
        });

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        async function generatePromptFromImage(base64Data, mimeType) {
            const currentApiKey = localStorage.getItem('gemini_api_key');
            if (!currentApiKey) {
                alert("Please enter and save your Gemini API Key in the settings box above first!");
                document.getElementById('promptText').value = "Please enter your Gemini API Key above to auto-generate prompts.";
                return;
            }

            const promptTextArea = document.getElementById('promptText');
            const aiStatus = document.getElementById('aiStatus');
            
            aiStatus.classList.remove('hidden');
            promptTextArea.value = "Analyzing images with Gemini 3.5 Flash...";
            promptTextArea.disabled = true;

            try {
                const base64Clean = base64Data.split(',')[1];
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${currentApiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Analyze this image and write a detailed, professional AI image generation prompt (suitable for Midjourney or DALL-E 3) describing its style, lighting, subject, colors, and composition. Return ONLY the prompt text without extra conversation." },
                                { inline_data: { mime_type: mimeType, data: base64Clean } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    promptTextArea.value = data.candidates[0].content.parts[0].text.trim();
                } else if (data.error) {
                    promptTextArea.value = `Error: ${data.error.message}`;
                } else {
                    promptTextArea.value = "A high quality cinematic photograph, highly detailed --ar 4:5";
                }
            } catch (error) {
                console.error("AI Error:", error);
                promptTextArea.value = "Cinematic style portrait shot with dramatic lighting --ar 4:5";
            } finally {
                aiStatus.classList.add('hidden');
                promptTextArea.disabled = false;
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (uploadedImagesArray.length === 0) {
                alert("Please select at least one image file!");
                return;
            }

            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i><span>Uploading...</span>';
            submitBtn.disabled = true;

            try {
                const newPrompt = {
                    imageUrls: uploadedImagesArray,
                    title: document.getElementById('promptTitle').value,
                    category: document.getElementById('promptCategory').value,
                    promptText: document.getElementById('promptText').value,
                    createdAt: Date.now()
                };

                await addDoc(collection(db, "prompts"), newPrompt);

                const alertBox = document.getElementById('successAlert');
                alertBox.classList.remove('hidden');
                this.reset();
                
                document.getElementById('imagePreviewContainer').classList.add('hidden');
                document.getElementById('imagePreviewContainer').innerHTML = "";
                document.getElementById('uploadPrompt').classList.remove('hidden');
                uploadedImagesArray = [];
                loadCategories();

                setTimeout(() => { alertBox.classList.add('hidden'); }, 3500);
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Failed to upload.");
            } finally {
                submitBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i><span>Publish to Cloud</span>';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
