<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PromptGenz - Admin Panel</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >
</head>

<body class="bg-zinc-950 text-white font-sans min-h-screen p-4 sm:p-8">

<div class="w-full max-w-3xl mx-auto bg-zinc-900 border border-zinc-800 rounded-3xl p-5 sm:p-7 shadow-2xl my-6">

    <!-- HEADER -->
    <div class="flex items-center justify-between pb-5 border-b border-zinc-800 mb-6">

        <div>
            <h1 class="text-xl font-bold text-amber-400">
                PromptGenz Admin
            </h1>

            <p class="text-xs text-zinc-400 mt-1">
                Manage Categories, Images & Multi-Angle Prompts
            </p>
        </div>

        <a
            href="index.html"
            class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-4 py-2 rounded-xl text-xs font-medium transition flex items-center gap-2"
        >
            <i class="fa-solid fa-arrow-left"></i>
            <span>View Site</span>
        </a>

    </div>


    <!-- GEMINI API KEY -->
    <div class="mb-6 bg-zinc-950 border border-zinc-800 p-4 rounded-2xl">

        <label class="block text-xs font-semibold text-amber-400 mb-2">
            <i class="fa-solid fa-key mr-1"></i>
            Gemini API Key
        </label>

        <div class="flex gap-2">

            <input
                type="password"
                id="apiKeyInput"
                placeholder="Paste your Gemini API key here..."
                class="flex-1 min-w-0 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-3 text-xs text-white placeholder-zinc-600 outline-none focus:border-amber-400"
            >

            <button
                type="button"
                id="saveApiKeyBtn"
                class="bg-amber-400 text-zinc-950 px-4 py-2 rounded-xl text-xs font-bold hover:bg-amber-500 transition"
            >
                Save
            </button>

        </div>

        <p id="apiKeyStatus" class="text-[10px] text-zinc-500 mt-2">
            API key is stored in this browser.
        </p>

    </div>


    <!-- MAIN FORM -->
    <form id="uploadForm" class="space-y-5">

        <!-- IMAGE UPLOAD -->
        <div>

            <label class="block text-xs font-semibold text-zinc-300 mb-2">
                Select Images
            </label>

            <div
                class="relative border-2 border-dashed border-zinc-800 hover:border-amber-400/50 rounded-2xl p-7 bg-zinc-950 transition cursor-pointer text-center"
            >

                <input
                    type="file"
                    id="imageFiles"
                    accept="image/jpeg,image/png,image/webp,image/gif"
                    multiple
                    required
                    class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-20"
                >

                <div id="uploadPrompt">

                    <i class="fa-solid fa-images text-4xl text-amber-400 mb-3"></i>

                    <p class="text-sm text-zinc-300 font-medium">
                        Select multiple angle photos
                    </p>

                    <p class="text-[10px] text-zinc-500 mt-1">
                        You can select 1, 2, 3, 4 or more images
                    </p>

                </div>

            </div>

            <!-- SELECTED IMAGE COUNT -->
            <div
                id="imageCount"
                class="hidden mt-2 text-[11px] text-amber-400"
            ></div>

        </div>


        <!-- IMAGE + PROMPT CARDS -->
        <div
            id="perImagePromptsSection"
            class="hidden space-y-3"
        >

            <label class="block text-xs font-semibold text-amber-400">
                Customize Prompt for Each Angle
            </label>

            <div
                id="imagePromptPairsContainer"
                class="space-y-3"
            ></div>

        </div>


        <!-- TITLE -->
        <div>

            <label class="block text-xs font-semibold text-zinc-300 mb-2">
                Main Post Title
            </label>

            <div class="flex items-center bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-3 focus-within:border-amber-400">

                <i class="fa-solid fa-heading text-zinc-500 mr-2 text-sm"></i>

                <input
                    type="text"
                    id="promptTitle"
                    required
                    placeholder="e.g. Cyberpunk Warrior Set"
                    class="bg-transparent border-none outline-none text-white w-full text-sm placeholder-zinc-600"
                >

            </div>

        </div>


        <!-- CATEGORY -->
        <div>

            <label class="block text-xs font-semibold text-zinc-300 mb-2">
                Category
            </label>

            <div class="flex gap-2">

                <div class="relative flex-1 bg-zinc-950 border border-zinc-800 rounded-xl">

                    <select
                        id="promptCategory"
                        required
                        class="w-full bg-transparent border-none outline-none text-white px-3 py-3 text-sm appearance-none cursor-pointer"
                    >
                        <option value="">
                            Loading categories...
                        </option>
                    </select>

                    <div class="absolute right-3 top-3.5 text-zinc-500 pointer-events-none">
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </div>

                </div>

                <button
                    type="button"
                    id="toggleNewCatBtn"
                    class="bg-zinc-800 hover:bg-zinc-700 text-amber-400 px-4 rounded-xl text-xs font-medium transition"
                >
                    <i class="fa-solid fa-plus"></i>
                    <span class="ml-1">New</span>
                </button>

            </div>


            <!-- NEW CATEGORY -->
            <div
                id="newCategoryBox"
                class="hidden mt-2 flex gap-2"
            >

                <input
                    type="text"
                    id="newCategoryInput"
                    placeholder="Enter new category name..."
                    class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-3 text-xs text-white placeholder-zinc-600 outline-none focus:border-amber-400"
                >

                <button
                    type="button"
                    id="saveNewCatBtn"
                    class="bg-amber-400 text-zinc-950 px-4 rounded-xl text-xs font-bold hover:bg-amber-500"
                >
                    Save
                </button>

            </div>

        </div>


        <!-- PUBLISH -->
        <button
            type="submit"
            id="publishBtn"
            class="w-full bg-amber-400 hover:bg-amber-500 text-zinc-950 font-bold py-3.5 rounded-xl transition text-sm flex items-center justify-center gap-2 shadow-lg shadow-amber-400/10"
        >

            <i class="fa-solid fa-cloud-arrow-up"></i>

            <span>
                Publish to Cloud
            </span>

        </button>

    </form>


    <!-- PROGRESS -->
    <div
        id="uploadProgressBox"
        class="hidden mt-5"
    >

        <div class="flex justify-between text-[10px] text-zinc-400 mb-2">

            <span id="progressText">
                Preparing...
            </span>

            <span id="progressPercent">
                0%
            </span>

        </div>

        <div class="w-full h-2 bg-zinc-800 rounded-full overflow-hidden">

            <div
                id="progressBar"
                class="h-full bg-amber-400 rounded-full transition-all duration-300"
                style="width:0%"
            ></div>

        </div>

    </div>


    <!-- SUCCESS -->
    <div
        id="successAlert"
        class="hidden mt-5 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 p-4 rounded-xl text-xs flex items-center gap-2"
    >

        <i class="fa-solid fa-circle-check text-base"></i>

        <span>
            Successfully published!
        </span>

    </div>


    <!-- ERROR -->
    <div
        id="errorAlert"
        class="hidden mt-5 bg-red-500/10 border border-red-500/20 text-red-400 p-4 rounded-xl text-xs"
    ></div>

</div>


<script type="module">

/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    setDoc,
    doc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey: "AIzaSyAcyASMFEogpp8BwgJc4hsPGNoIZOb6dKo",

    authDomain: "promptgenz-daaf3.firebaseapp.com",

    projectId: "promptgenz-daaf3",

    storageBucket: "promptgenz-daaf3.firebasestorage.app",

    messagingSenderId: "751005531769",

    appId: "1:751005531769:web:20b8330970e001dd691ea8",

    measurementId: "G-VF4QP1SLSQ"

};


/* =========================================================
   INITIALIZE FIREBASE
========================================================= */

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const storage = getStorage(app);


/* =========================================================
   VARIABLES
========================================================= */

let uploadedImageFiles = [];

let generatedPrompts = [];


/* =========================================================
   ELEMENTS
========================================================= */

const apiKeyInput =
    document.getElementById("apiKeyInput");

const apiKeyStatus =
    document.getElementById("apiKeyStatus");

const imageFiles =
    document.getElementById("imageFiles");

const imageCount =
    document.getElementById("imageCount");

const promptContainer =
    document.getElementById("imagePromptPairsContainer");

const promptSection =
    document.getElementById("perImagePromptsSection");

const categorySelect =
    document.getElementById("promptCategory");

const newCategoryBox =
    document.getElementById("newCategoryBox");

const newCategoryInput =
    document.getElementById("newCategoryInput");

const uploadProgressBox =
    document.getElementById("uploadProgressBox");

const progressBar =
    document.getElementById("progressBar");

const progressText =
    document.getElementById("progressText");

const progressPercent =
    document.getElementById("progressPercent");

const successAlert =
    document.getElementById("successAlert");

const errorAlert =
    document.getElementById("errorAlert");


/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener("DOMContentLoaded", async () => {

    const savedKey =
        localStorage.getItem("gemini_api_key");

    if (savedKey) {

        apiKeyInput.value = savedKey;

        apiKeyStatus.innerHTML =
            '<span class="text-emerald-400">' +
            '<i class="fa-solid fa-check-circle mr-1"></i>' +
            'API Key loaded.' +
            '</span>';

    }

    await loadCategories();

});


/* =========================================================
   SAVE GEMINI API KEY
========================================================= */

document
.getElementById("saveApiKeyBtn")
.addEventListener("click", () => {

    const key =
        apiKeyInput.value.trim();

    if (!key) {

        alert("Please enter Gemini API key.");

        return;
    }

    localStorage.setItem(
        "gemini_api_key",
        key
    );

    apiKeyStatus.innerHTML =
        '<span class="text-emerald-400">' +
        '<i class="fa-solid fa-check-circle mr-1"></i>' +
        'API Key saved successfully.' +
        '</span>';

});


/* =========================================================
   LOAD CATEGORIES
========================================================= */

async function loadCategories() {

    categorySelect.innerHTML =
        '<option value="">Loading categories...</option>';

    try {

        const snapshot =
            await getDocs(
                collection(db, "categories")
            );

        let categories = [];

        snapshot.forEach((item) => {

            const data = item.data();

            if (data.name) {

                categories.push(data.name);

            }

        });


        /* DEFAULT CATEGORIES */

        if (categories.length === 0) {

            categories = [
                "Portraits",
                "Cinematic",
                "Couple",
                "Trending",
                "Fashion",
                "Anime",
                "Photography"
            ];

            for (const category of categories) {

                try {

                    await setDoc(
                        doc(db, "categories", category),
                        {
                            name: category,
                            createdAt: Date.now()
                        }
                    );

                } catch (error) {

                    console.error(
                        "Category creation error:",
                        error
                    );

                }

            }

        }


        categories.sort(
            (a, b) =>
                a.localeCompare(b)
        );


        categorySelect.innerHTML =
            '<option value="">Select Category</option>';


        categories.forEach((category) => {

            const option =
                document.createElement("option");

            option.value = category;

            option.textContent = category;

            categorySelect.appendChild(option);

        });


    } catch (error) {

        console.error(
            "Category loading error:",
            error
        );

        categorySelect.innerHTML = `
            <option value="Portraits">Portraits</option>
            <option value="Cinematic">Cinematic</option>
            <option value="Trending">Trending</option>
        `;

        showError(
            "Categories load nahi ho pa rahi. Firebase Firestore rules check karo."
        );

    }

}


/* =========================================================
   NEW CATEGORY TOGGLE
========================================================= */

document
.getElementById("toggleNewCatBtn")
.addEventListener("click", () => {

    newCategoryBox.classList.toggle("hidden");

});


/* =========================================================
   CREATE NEW CATEGORY
========================================================= */

document
.getElementById("saveNewCatBtn")
.addEventListener("click", async () => {

    const name =
        newCategoryInput.value.trim();

    if (!name) {

        alert("Please enter category name.");

        return;
    }


    const categoryName =
        name.replace(/\s+/g, " ");


    try {

        await setDoc(
            doc(db, "categories", categoryName),
            {
                name: categoryName,
                createdAt: Date.now()
            }
        );


        const exists =
            Array.from(
                categorySelect.options
            ).some(
                option =>
                    option.value.toLowerCase() ===
                    categoryName.toLowerCase()
            );


        if (!exists) {

            const option =
                document.createElement("option");

            option.value = categoryName;

            option.textContent = categoryName;

            categorySelect.appendChild(option);

        }


        categorySelect.value =
            categoryName;

        newCategoryInput.value = "";

        newCategoryBox.classList.add(
            "hidden"
        );


        alert(
            `Category "${categoryName}" created successfully.`
        );


    } catch (error) {

        console.error(
            "New category error:",
            error
        );

        showError(
            "Category create nahi ho payi. Firestore rules check karo."
        );

    }

});


/* =========================================================
   IMAGE SELECTION
========================================================= */

imageFiles.addEventListener(
    "change",
    async (event) => {

        const files =
            Array.from(event.target.files || []);


        if (files.length === 0) {

            uploadedImageFiles = [];

            promptContainer.innerHTML = "";

            promptSection.classList.add(
                "hidden"
            );

            imageCount.classList.add(
                "hidden"
            );

            return;
        }


        /* SAVE FILES */

        uploadedImageFiles = files;


        generatedPrompts =
            new Array(files.length).fill("");


        /* COUNT */

        imageCount.textContent =
            `${files.length} image${files.length > 1 ? "s" : ""} selected`;

        imageCount.classList.remove(
            "hidden"
        );


        promptContainer.innerHTML = "";

        promptSection.classList.remove(
            "hidden"
        );


        /* CREATE CARDS */

        for (
            let i = 0;
            i < files.length;
            i++
        ) {

            const file =
                files[i];


            if (!file.type.startsWith("image/")) {

                continue;
            }


            const preview =
                await createPreview(file);


            const card =
                document.createElement("div");

            card.className =
                "bg-zinc-950 border border-zinc-800 p-3 rounded-2xl flex flex-col sm:flex-row gap-3";


            card.innerHTML = `

                <div class="flex-shrink-0">

                    <img
                        src="${preview}"
                        class="w-full sm:w-24 h-24 object-cover rounded-xl border border-zinc-700"
                    >

                    <div class="text-[9px] text-zinc-500 mt-1 text-center">
                        Angle ${i + 1}
                    </div>

                </div>


                <div class="flex-1 w-full">

                    <div class="flex justify-between items-center mb-1">

                        <span class="text-[11px] text-zinc-400 font-semibold">
                            Angle ${i + 1} Prompt
                        </span>

                        <span
                            id="status_${i}"
                            class="text-[10px] text-amber-400"
                        >
                            <i class="fa-solid fa-spinner animate-spin mr-1"></i>
                            Generating...
                        </span>

                    </div>


                    <textarea
                        id="prompt_${i}"
                        rows="4"
                        class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-amber-400 resize-y"
                        placeholder="Prompt for this angle..."
                    ></textarea>

                </div>
            `;


            promptContainer.appendChild(card);


            /* GENERATE PROMPT */

            generatePromptForImage(
                file,
                i
            );

        }

    }
);


/* =========================================================
   IMAGE PREVIEW
========================================================= */

function createPreview(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => resolve(reader.result);

            reader.onerror =
                reject;

            reader.readAsDataURL(file);

        }
    );

}


/* =========================================================
   GEMINI PROMPT GENERATION
========================================================= */

async function generatePromptForImage(
    file,
    index
) {

    const apiKey =
        localStorage.getItem(
            "gemini_api_key"
        );


    const textarea =
        document.getElementById(
            `prompt_${index}`
        );

    const status =
        document.getElementById(
            `status_${index}`
        );


    if (!apiKey) {

        textarea.value =
            "Cinematic professional photography, detailed composition, realistic lighting, sharp focus, natural textures --ar 4:5";

        status.innerHTML =
            '<span class="text-zinc-500">API key not set</span>';

        return;
    }


    try {

        const base64 =
            await createPreview(file);


        const cleanBase64 =
            base64.split(",")[1];


        const response =
            await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        contents: [

                            {

                                parts: [

                                    {
                                        text:
                                            "Analyze this image carefully. Write one detailed professional AI image-generation prompt describing the subject, pose, camera angle, composition, lighting, environment, clothing, colors, background, depth of field and photography style. Preserve the visual composition. Return ONLY the prompt text."
                                    },

                                    {

                                        inline_data: {

                                            mime_type:
                                                file.type,

                                            data:
                                                cleanBase64

                                        }

                                    }

                                ]

                            }

                        ]

                    })

                }
            );


        const data =
            await response.json();


        if (
            data.candidates &&
            data.candidates[0] &&
            data.candidates[0].content &&
            data.candidates[0].content.parts &&
            data.candidates[0].content.parts[0]
        ) {

            const text =
                data
                .candidates[0]
                .content
                .parts[0]
                .text
                .trim();


            textarea.value =
                text;

            generatedPrompts[index] =
                text;


            status.innerHTML =
                '<span class="text-emerald-400">' +
                '<i class="fa-solid fa-check mr-1"></i>' +
                'Ready' +
                '</span>';

        } else {

            throw new Error(
                data.error?.message ||
                "Gemini response unavailable"
            );

        }


    } catch (error) {

        console.error(
            `Gemini error for image ${index + 1}:`,
            error
        );


        textarea.value =
            "Cinematic professional photography, realistic lighting, detailed composition, sharp subject focus, natural textures, high dynamic range --ar 4:5";


        generatedPrompts[index] =
            textarea.value;


        status.innerHTML =
            '<span class="text-amber-400">' +
            'Default prompt' +
            '</span>';

    }

}


/* =========================================================
   FIREBASE STORAGE IMAGE UPLOAD
   IMPORTANT:
   NO BASE64 IS STORED IN FIRESTORE
========================================================= */

async function uploadImageToFirebase(
    file,
    index,
    total
) {

    if (!file) {

        throw new Error(
            `Image ${index + 1} is missing.`
        );

    }


    const safeName =
        file.name
            .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
            );


    const uniqueName =
        `${Date.now()}_${index}_${safeName}`;


    const storagePath =
        `prompt-images/${uniqueName}`;


    const storageReference =
        ref(
            storage,
            storagePath
        );


    progressText.textContent =
        `Uploading image ${index + 1} of ${total}...`;


    const startPercent =
        Math.round(
            (index / total) * 100
        );


    progressBar.style.width =
        `${startPercent}%`;

    progressPercent.textContent =
        `${startPercent}%`;


    /* UPLOAD */

    await uploadBytes(
        storageReference,
        file,
        {
            contentType:
                file.type,

            customMetadata: {
                originalName:
                    file.name
            }
        }
    );


    /* GET PUBLIC DOWNLOAD URL */

    const downloadURL =
        await getDownloadURL(
            storageReference
        );


    const endPercent =
        Math.round(
            ((index + 1) / total) * 100
        );


    progressBar.style.width =
        `${endPercent}%`;

    progressPercent.textContent =
        `${endPercent}%`;


    return downloadURL;

}


/* =========================================================
   PUBLISH FORM
========================================================= */

document
.getElementById("uploadForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        hideAlerts();


        /* CHECK IMAGES */

        if (
            uploadedImageFiles.length === 0
        ) {

            showError(
                "Please select at least one image."
            );

            return;
        }


        /* CHECK TITLE */

        const title =
            document
            .getElementById("promptTitle")
            .value
            .trim();


        if (!title) {

            showError(
                "Please enter post title."
            );

            return;
        }


        /* CHECK CATEGORY */

        const category =
            categorySelect.value;


        if (!category) {

            showError(
                "Please select a category."
            );

            return;
        }


        const publishBtn =
            document.getElementById(
                "publishBtn"
            );


        publishBtn.disabled =
            true;


        publishBtn.innerHTML =
            '<i class="fa-solid fa-spinner animate-spin"></i>' +
            '<span>Uploading...</span>';


        uploadProgressBox.classList.remove(
            "hidden"
        );


        progressBar.style.width =
            "0%";


        progressPercent.textContent =
            "0%";


        try {

            const imagePromptPairs =
                [];


            /* =================================================
               UPLOAD EACH IMAGE TO FIREBASE STORAGE
            ================================================= */

            for (
                let i = 0;
                i < uploadedImageFiles.length;
                i++
            ) {

                const file =
                    uploadedImageFiles[i];


                const imageUrl =
                    await uploadImageToFirebase(
                        file,
                        i,
                        uploadedImageFiles.length
                    );


                const textarea =
                    document.getElementById(
                        `prompt_${i}`
                    );


                const prompt =
                    textarea
                    ? textarea.value.trim()
                    : "";


                imagePromptPairs.push({

                    imageUrl:
                        imageUrl,

                    prompt:
                        prompt ||
                        "Cinematic professional photography, realistic lighting, detailed composition, sharp focus --ar 4:5"

                });

            }


            /* =================================================
               CREATE FIRESTORE DOCUMENT
               ONLY URLS + TEXT ARE STORED
            ================================================= */

            progressText.textContent =
                "Saving post information...";


            progressBar.style.width =
                "100%";


            progressPercent.textContent =
                "100%";


            const newPost = {

                title:
                    title,

                category:
                    category,

                imagePromptPairs:
                    imagePromptPairs,

                imageCount:
                    imagePromptPairs.length,

                createdAt:
                    Date.now()

            };


            await addDoc(
                collection(
                    db,
                    "prompts"
                ),
                newPost
            );


            /* =================================================
               SUCCESS
            ================================================= */

            successAlert.classList.remove(
                "hidden"
            );


            successAlert.querySelector(
                "span"
            ).textContent =
                `${imagePromptPairs.length} angle image${imagePromptPairs.length > 1 ? "s" : ""} successfully published!`;


            /* RESET */

            this.reset();

            uploadedImageFiles = [];

            generatedPrompts = [];

            promptContainer.innerHTML = "";

            promptSection.classList.add(
                "hidden"
            );

            imageCount.classList.add(
                "hidden"
            );

            uploadProgressBox.classList.add(
                "hidden"
            );


            /* Reload categories */

            await loadCategories();


            setTimeout(() => {

                successAlert.classList.add(
                    "hidden"
                );

            }, 4000);


        } catch (error) {

            console.error(
                "FINAL UPLOAD ERROR:",
                error
            );


            let message =
                "Upload failed.";


            if (
                error &&
                error.code ===
                "storage/unauthorized"
            ) {

                message =
                    "Firebase Storage permission denied. Storage Rules check karo.";

            } else if (
                error &&
                error.code ===
                "storage/canceled"
            ) {

                message =
                    "Image upload cancelled.";

            } else if (
                error &&
                error.code ===
                "storage/quota-exceeded"
            ) {

                message =
                    "Firebase Storage quota exceeded.";

            } else if (
                error &&
                error.message
            ) {

                message =
                    error.message;

            }


            showError(
                message
            );


        } finally {

            publishBtn.disabled =
                false;


            publishBtn.innerHTML =
                '<i class="fa-solid fa-cloud-arrow-up"></i>' +
                '<span>Publish to Cloud</span>';

        }

    }
);


/* =========================================================
   ERROR MESSAGE
========================================================= */

function showError(message) {

    errorAlert.innerHTML =
        '<i class="fa-solid fa-circle-exclamation mr-2"></i>' +
        message;

    errorAlert.classList.remove(
        "hidden"
    );

}


function hideAlerts() {

    errorAlert.classList.add(
        "hidden"
    );

    successAlert.classList.add(
        "hidden"
    );

}


</script>

</body>
</html>
