<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptGenz - Admin Panel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white font-sans min-h-screen p-4 sm:p-8 flex flex-col justify-center items-center">

    <div class="w-full max-w-xl bg-zinc-900 border border-zinc-800 rounded-3xl p-6 shadow-2xl">
        <!-- Header -->
        <div class="flex items-center justify-between pb-5 border-b border-zinc-800 mb-6">
            <div>
                <h1 class="text-xl font-bold text-amber-400">PromptGenz Admin</h1>
                <p class="text-xs text-zinc-400 mt-1">Upload new AI image prompts from your device</p>
            </div>
            <a href="index.html" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-4 py-2 rounded-xl text-xs font-medium transition flex items-center space-x-2">
                <i class="fa-solid fa-arrow-left"></i>
                <span>View Site</span>
            </a>
        </div>

        <!-- Upload Form -->
        <form id="uploadForm" class="space-y-4">
            <!-- Image File Upload -->
            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1.5">Select Image File</label>
                <div class="flex flex-col items-center justify-center border-2 border-dashed border-zinc-800 hover:border-amber-400/50 rounded-2xl p-6 bg-zinc-950 transition cursor-pointer relative overflow-hidden group" id="dropZone">
                    <input type="file" id="imageFile" accept="image/*" required class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-20">
                    <div id="uploadPrompt" class="text-center">
                        <i class="fa-solid fa-cloud-arrow-up text-3xl text-amber-400 mb-2 group-hover:scale-110 transition"></i>
                        <p class="text-xs text-zinc-300 font-medium">Click to upload or drag & drop</p>
                        <p class="text-[10px] text-zinc-500 mt-1">PNG, JPG, WEBP supported</p>
                    </div>
                    <!-- Image Preview (Hidden initially) -->
                    <img id="imagePreview" class="hidden absolute inset-0 w-full h-full object-cover rounded-2xl z-10">
                </div>
            </div>

            <!-- Title -->
            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1.5">Prompt Title</label>
                <div class="flex items-center bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-3 focus-within:border-amber-400 transition">
                    <i class="fa-solid fa-heading text-zinc-500 mr-2 text-sm"></i>
                    <input type="text" id="promptTitle" required placeholder="e.g. City Pop Style" class="bg-transparent border-none outline-none text-white w-full text-sm placeholder-zinc-600">
                </div>
            </div>

            <!-- Category Selection -->
            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1.5">Category</label>
                <div class="relative bg-zinc-950 border border-zinc-800 rounded-xl focus-within:border-amber-400 transition">
                    <select id="promptCategory" class="w-full bg-transparent border-none outline-none text-white px-3 py-3 text-sm appearance-none cursor-pointer">
                        <option value="Portraits" class="bg-zinc-900">Portraits</option>
                        <option value="Cinematic" class="bg-zinc-900">Cinematic</option>
                        <option value="Couple" class="bg-zinc-900">Couple</option>
                        <option value="Trending" class="bg-zinc-900">Trending Now</option>
                    </select>
                    <div class="absolute right-3 top-3.5 text-zinc-500 pointer-events-none">
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </div>
                </div>
            </div>

            <!-- Exact AI Prompt Text -->
            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1.5">AI Generation Prompt (For users to copy)</label>
                <textarea id="promptText" rows="4" required placeholder="A cinematic shot of a cyberpunk city at night with neon lights..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-white placeholder-zinc-600 outline-none resize-none focus:border-amber-400 transition"></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-amber-400 hover:bg-amber-500 text-zinc-950 font-bold py-3.5 rounded-xl transition text-sm flex items-center justify-center space-x-2 shadow-lg shadow-amber-400/10">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span>Publish Prompt</span>
            </button>
        </form>

        <!-- Success Alert -->
        <div id="successAlert" class="hidden mt-4 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 p-3.5 rounded-xl text-xs flex items-center space-x-2 animate-pulse">
            <i class="fa-solid fa-circle-check text-base"></i>
            <span>Image and prompt successfully published! Check your website.</span>
        </div>
    </div>

    <!-- Script to handle file reading and saving -->
    <script>
        let uploadedImageBase64 = "";

        // Preview image on file select
        document.getElementById('imageFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImageBase64 = event.target.result;
                    const preview = document.getElementById('imagePreview');
                    const uploadPrompt = document.getElementById('uploadPrompt');
                    
                    preview.src = uploadedImageBase64;
                    preview.classList.remove('hidden');
                    uploadPrompt.classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        // Form submission handler
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();

            if (!uploadedImageBase64) {
                alert("Please select an image file first!");
                return;
            }

            const newPrompt = {
                imageUrl: uploadedImageBase64,
                title: document.getElementById('promptTitle').value,
                category: document.getElementById('promptCategory').value,
                promptText: document.getElementById('promptText').value,
                id: Date.now()
            };

            // Save to LocalStorage
            let prompts = JSON.parse(localStorage.getItem('promptgenz_prompts')) || [];
            prompts.unshift(newPrompt);
            localStorage.setItem('promptgenz_prompts', JSON.stringify(prompts));

            // Show success message & reset
            const alertBox = document.getElementById('successAlert');
            alertBox.classList.remove('hidden');
            this.reset();
            
            // Reset preview
            document.getElementById('imagePreview').classList.add('hidden');
            document.getElementById('imagePreview').src = "";
            document.getElementById('uploadPrompt').classList.remove('hidden');
            uploadedImageBase64 = "";

            setTimeout(() => {
                alertBox.classList.add('hidden');
            }, 3500);
        });
    </script>
</body>
</html>
