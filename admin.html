/* =========================================================
   LOAD CATEGORIES
========================================================= */

async function loadCategories() {

    categorySelect.innerHTML =
        `
        <option value="">
            Loading categories...
        </option>
        `;

    try {

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "categories"
                )
            );

        let categories = [];

        snapshot.forEach(
            item => {

                const data =
                    item.data();

                if (
                    data &&
                    data.name
                ) {

                    categories.push(
                        data.name
                    );

                }

            }
        );


        /* DEFAULT CATEGORIES */

        if (
            categories.length === 0
        ) {

            categories = [
                "Portraits",
                "Cinematic",
                "Couple",
                "Trending",
                "Fashion",
                "Anime",
                "Photography"
            ];


            for (
                const category
                of categories
            ) {

                await setDoc(
                    doc(
                        db,
                        "categories",
                        category
                    ),
                    {
                        name:
                            category,

                        createdAt:
                            Date.now()
                    }
                );

            }

        }


        /* REMOVE DUPLICATES */

        categories =
            [
                ...new Set(
                    categories
                )
            ];


        /* SORT */

        categories.sort(
            (a, b) =>
                a.localeCompare(b)
        );


        categorySelect.innerHTML =
            `
            <option value="">
                Select Category
            </option>
            `;


        categories.forEach(
            category => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    category;

                option.textContent =
                    category;

                categorySelect.appendChild(
                    option
                );

            }
        );


    } catch (error) {

        console.error(
            "Category loading error:",
            error
        );


        categorySelect.innerHTML =
            `
            <option value="">
                Select Category
            </option>

            <option value="Portraits">
                Portraits
            </option>

            <option value="Cinematic">
                Cinematic
            </option>

            <option value="Trending">
                Trending
            </option>
            `;

        showError(
            "Categories load nahi ho pa rahi. Firebase Firestore Rules check karo."
        );

    }

}

        const categoryName =
            rawName

        try {

            await setDoc(
                doc(
                    db,
                    "categories",
                    categoryName

                {
                    name:
                        categoryName,

                    createdAt:
                        Date.now()

            );


            const alreadyExists =
                Array.from(
                    categorySelect.options
                ).some(
                    option =>

            if (

                    document.createElement(

                categorySelect.appendChild(

/* =========================================================
   IMAGE SELECTION
========================================================= */

imageFiles.addEventListener(
    "change",
    async event => {

        const files =
            Array.from(
                event.target.files || []
            );


        if (
            files.length === 0
        ) {

            uploadedImageFiles =
                [];

            generatedPrompts =
                [];

            promptContainer.innerHTML =
                "";

            promptSection.classList.add(
                "hidden"
            );

            imageCount.classList.add(
                "hidden"
            );

            return;

        }


        /* SAVE FILES */

        uploadedImageFiles =
            files;


        generatedPrompts =
            new Array(
                files.length
            ).fill("");


        /* COUNT */

        imageCount.textContent =
            `${files.length} image${files.length > 1 ? "s" : ""} selected`;

        imageCount.classList.remove(
            "hidden"
        );


        promptContainer.innerHTML =
            "";

        promptSection.classList.remove(
            "hidden"
        );


        /* CREATE IMAGE CARDS */

        for (
            let i = 0;
            i < files.length;
            i++
        ) {

            const file =
                files[i];


            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                continue;

            }


            const preview =
                await fileToBase64(
                    file
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "bg-zinc-950 border border-zinc-800 p-3 rounded-2xl flex flex-col sm:flex-row gap-3";


            card.innerHTML =
                `

                <div class="flex-shrink-0">

                    <img
                        src="${preview}"
                        class="w-full sm:w-28 h-28 object-cover rounded-xl border border-zinc-700"
                    >

                    <div class="text-[9px] text-zinc-500 mt-1 text-center">
                        Angle ${i + 1}
                    </div>

                </div>


                <div class="flex-1 w-full">

                    <div class="flex justify-between items-center mb-1">

                        <span class="text-[11px] text-zinc-300 font-semibold">
                            Angle ${i + 1} Detailed Prompt
                        </span>

                        <span
                            id="status_${i}"
                            class="text-[10px] text-amber-400"
                        >
                            <i class="fa-solid fa-spinner animate-spin mr-1"></i>
                            Generating...
                        </span>

                    </div>


                    <textarea
                        id="prompt_${i}"
                        rows="7"
                        class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-xs leading-5 text-white outline-none focus:border-amber-400 resize-y"
                        placeholder="Detailed AI prompt will appear here..."
                    ></textarea>


                    <div class="flex justify-between mt-1">

                        <span
                            id="wordCount_${i}"
                            class="text-[9px] text-zinc-600"
                        >
                            0 words
                        </span>

                        <span class="text-[9px] text-zinc-600">
                            You can edit this prompt
                        </span>

                    </div>

                </div>

                `;


            promptContainer.appendChild(
                card
            );


            /* WORD COUNTER */

            const textarea =
                document.getElementById(
                    `prompt_${i}`
                );

            const wordCounter =
                document.getElementById(
                    `wordCount_${i}`
                );


            textarea.addEventListener(
                "input",
                () => {

                    const words =
                        countWords(
                            textarea.value
                        );

                    wordCounter.textContent =
                        `${words} words`;

                }
            );


            /* GENERATE PROMPT */

            generatePromptForImage(
                file,
                i
            );

        }

    }
);


/* =========================================================
   FILE TO BASE64
========================================================= */

function fileToBase64(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () =>
                    resolve(
                        reader.result
                    );

            reader.onerror =
                () =>
                    reject(
                        reader.error
                    );

            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =========================================================
   COUNT WORDS
========================================================= */

function countWords(text) {

    return text
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .length;

}

/* =========================================================
   GEMINI PROMPT GENERATION
========================================================= */

async function generatePromptForImage(
    file,
    index
) {

    const apiKey =
        localStorage.getItem(
            "gemini_api_key"
        );


    const textarea =
        document.getElementById(
            `prompt_${index}`
        );

    const status =
        document.getElementById(
            `status_${index}`
        );

    const wordCounter =
        document.getElementById(
            `wordCount_${index}`
        );


    if (!apiKey) {

        const fallback =
            `Cinematic professional photography of the subject shown in the reference, preserving the exact pose, composition, clothing, facial appearance, camera perspective, lighting and environment. Highly realistic details, natural skin texture, realistic fabric texture, detailed background, professional camera look, shallow depth of field, realistic shadows and highlights, cinematic color grading, high dynamic range, photorealistic quality, sharp subject focus, subtle atmospheric depth, premium editorial photography, realistic proportions and natural textures.`;

        textarea.value =
            fallback;

        wordCounter.textContent =
            `${countWords(fallback)} words`;

        status.innerHTML =
            `
            <span class="text-zinc-500">
                API key not set
            </span>
            `;

        return;
    }


    try {

        const imageBase64 =
            await fileToBase64(
                file
            );


        const cleanBase64 =
            imageBase64.split(",")[1];


        const response =
            await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            contents: [

                                {

                                    parts: [

                                        {
                                            text:
                                                promptInstruction
                                        },

                                        {

                                            inline_data: {

                                                mime_type:
                                                    file.type,

                                                data:
                                                    cleanBase64

                                            }

                                        }

                                    ]

                                }

                            ],

                            generationConfig: {

                                temperature:
                                    0.7,

                                maxOutputTokens:
                                    1200

                            }

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data?.error?.message ||
                `Gemini API error ${response.status}`
            );

        }


        const generatedText =
            data
            ?.candidates?.[0]
            ?.content?.parts?.[0]
            ?.text
            ?.trim();


        if (!generatedText) {

            throw new Error(
                "Gemini returned an empty prompt."
            );

        }


        textarea.value =
            generatedText;

        generatedPrompts[index] =
            generatedText;


        wordCounter.textContent =
            `${countWords(generatedText)} words`;


        status.innerHTML =
            `
            <span class="text-emerald-400">
                <i class="fa-solid fa-check mr-1"></i>
                Ready
            </span>
            `;


    } catch (error) {

        console.error(
            `Gemini error for angle ${index + 1}:`,
            error
        );


        const fallback =
            `Cinematic professional photograph matching the reference composition, featuring the same subject appearance, pose, clothing, camera perspective and environment. Preserve the subject's facial characteristics, hairstyle, body position, expression and visible details. Recreate the exact framing and perspective with realistic professional camera optics, natural depth of field and accurate spatial relationships. Use realistic lighting matching the scene, including directional illumination, soft highlights, natural shadows, realistic reflections and subtle ambient light. Preserve the original color palette, clothing colors, environmental tones and cinematic color grading. Highly detailed realistic skin texture, natural hair texture, realistic fabric folds, accurate material textures, sharp subject details, soft background separation, realistic depth, high dynamic range, photorealistic rendering, premium editorial photography, cinematic atmosphere, professional full-frame camera look, natural contrast, realistic shadows and highlights, subtle film grain, ultra-detailed textures and authentic photographic imperfections.`;

        textarea.value =
            fallback;

        generatedPrompts[index] =
            fallback;


        wordCounter.textContent =
            `${countWords(fallback)} words`;


        status.innerHTML =
            `
            <span class="text-amber-400">
                Default prompt
            </span>
            `;

    }

}


/* =========================================================
   FIREBASE STORAGE UPLOAD
========================================================= */

async function uploadImageToFirebase(
    file,
    index,
    total
) {

    if (!file) {

        throw new Error(
            `Image ${index + 1} missing.`
        );

    }


    const cleanFileName =
        file.name
        .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
        );


    const uniqueName =
        `${Date.now()}_${Math.random().toString(36).slice(2, 9)}_${cleanFileName}`;


    const storagePath =
        `prompt-images/${uniqueName}`;


    const storageReference =
        ref(
            storage,
            storagePath
        );


    const startPercent =
        Math.round(
            (index / total) * 100
        );


    progressText.textContent =
        `Uploading image ${index + 1} of ${total}...`;

    progressBar.style.width =
        `${startPercent}%`;

    progressPercent.textContent =
        `${startPercent}%`;


    await uploadBytes(
        storageReference,
        file,
        {
            contentType:
                file.type,

            customMetadata: {

                originalName:
                    file.name

            }

        }
    );


    const downloadURL =
        await getDownloadURL(
            storageReference
        );


    const endPercent =
        Math.round(
            ((index + 1) / total) * 100
        );


    progressBar.style.width =
        `${endPercent}%`;

    progressPercent.textContent =
        `${endPercent}%`;


    return downloadURL;

}
