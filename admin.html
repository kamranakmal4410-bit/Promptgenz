function showStatus(message, type = "info") {

    statusBox.classList.remove(
        "hidden",
        "bg-red-500/10",
        "border-red-500/20",
        "text-red-400",
        "bg-emerald-500/10",
        "border-emerald-500/20",
        "text-emerald-400",
        "bg-amber-500/10",
        "border-amber-500/20",
        "text-amber-400",
        "bg-blue-500/10",
        "border-blue-500/20",
        "text-blue-400"
    );

    if (type === "success") {

        statusBox.classList.add(
            "bg-emerald-500/10",
            "border",
            "border-emerald-500/20",
            "text-emerald-400"
        );

    } else if (type === "error") {

        statusBox.classList.add(
            "bg-red-500/10",
            "border",
            "border-red-500/20",
            "text-red-400"
        );

    } else if (type === "warning") {

        statusBox.classList.add(
            "bg-amber-500/10",
            "border",
            "border-amber-500/20",
            "text-amber-400"
        );

    } else {

        statusBox.classList.add(
            "bg-blue-500/10",
            "border",
            "border-blue-500/20",
            "text-blue-400"
        );

    }

    statusBox.innerHTML = message;

    statusBox.classList.remove("hidden");
}

/* =========================================================
   CATEGORY LOADING
========================================================= */

async function loadCategories() {

    const select =
        document.getElementById("promptCategory");

    select.innerHTML =
        `<option value="">Loading categories...</option>`;

    try {

        const snapshot =
            await getDocs(
                collection(db, "categories")
            );

        const categories = [];

        snapshot.forEach(item => {

            const data =
                item.data();

            if (
                data &&
                data.name &&
                !categories.includes(data.name)
            ) {

                categories.push(data.name);

            }

        });


        /*
            Create default categories if collection empty
        */

        if (categories.length === 0) {

            const defaults = [
                "Portraits",
                "Cinematic",
                "Traditional",
                "Trending",
                "Fashion",
                "Photography",
                "Couple",
                "Nature",
                "Travel",
                "Creative"
            ];

            for (const category of defaults) {

                try {

                    await setDoc(
                        doc(db, "categories", category),
                        {
                            name: category,
                            createdAt: serverTimestamp()
                        }
                    );

                    categories.push(category);

                } catch (error) {

                    console.error(
                        "Default category error:",
                        error
                    );

                }

            }

        }


        categories.sort(
            (a, b) =>
                a.localeCompare(b)
        );


        select.innerHTML =
            `<option value="">Select category</option>`;


        categories.forEach(category => {

            const option =
                document.createElement("option");

            option.value = category;

            option.textContent = category;

            select.appendChild(option);

        });


        if (categories.length > 0) {

            select.value = categories[0];

        }


    } catch (error) {

        console.error(
            "Category loading error:",
            error
        );

        /*
            Don't leave select stuck on loading.
        */

        select.innerHTML = "";

        [
            "Portraits",
            "Cinematic",
            "Traditional",
            "Trending"
        ].forEach(category => {

            const option =
                document.createElement("option");

            option.value = category;

            option.textContent = category;

            select.appendChild(option);

        });

        select.value = "Portraits";


        showStatus(
            `<i class="fa-solid fa-triangle-exclamation mr-2"></i>
             Firebase categories could not be loaded.
             Default categories are available.`,
            "warning"
        );

    }

}

async function saveNewCategory() {

    const name =
        newCategoryInput.value.trim();

    if (!name) {

        alert("Enter category name.");

        return;

    }


    if (name.length > 60) {

        alert("Category name is too long.");

        return;

    }


    const button =
        document.getElementById("saveNewCatBtn");

    button.disabled = true;

    button.innerHTML =
        `<span class="loader"></span>`;


    try {

        /*
            Safe document ID
        */

        const categoryId =
            name
                .toLowerCase()
                .replace(/[\/\\#?]/g, "-")
                .replace(/\s+/g, "-")
                .replace(/[^a-z0-9-_]/gi, "");


        if (!categoryId) {

            throw new Error(
                "Invalid category name."
            );

        }


        await setDoc(
            doc(db, "categories", categoryId),
            {
                name: name,
                createdAt: serverTimestamp()
            }
        );


        await loadCategories();


        promptCategory.value =
            name;


        newCategoryInput.value = "";

        newCategoryBox
            .classList
            .add("hidden");


        showStatus(
            `<i class="fa-solid fa-circle-check mr-2"></i>
             Category "${escapeHtml(name)}" created successfully.`,
            "success"
        );


    } catch (error) {

        console.error(
            "Category create error:",
            error
        );

        showStatus(
            `<i class="fa-solid fa-triangle-exclamation mr-2"></i>
             Failed to create category: ${escapeHtml(error.message)}`,
            "error"
        );

    } finally {

        button.disabled = false;

        button.textContent = "Save";

    }

}


/* =========================================================
   IMAGE COMPRESSION
========================================================= */

function compressImageToDataURL(file) {

    return new Promise((resolve, reject) => {

        const reader =
            new FileReader();


        reader.onload = event => {

            const img =
                new Image();


            img.onload = () => {

                const MAX_WIDTH = 1000;

                const MAX_HEIGHT = 1000;


                let width =
                    img.naturalWidth;

                let height =
                    img.naturalHeight;


                const scale =
                    Math.min(
                        1,
                        MAX_WIDTH / width,
                        MAX_HEIGHT / height
                    );


                width =
                    Math.round(
                        width * scale
                    );

                height =
                    Math.round(
                        height * scale
                    );


                const canvas =
                    document.createElement("canvas");


                canvas.width =
                    width;

                canvas.height =
                    height;


                const ctx =
                    canvas.getContext("2d");


                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );


                const dataUrl =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.82
                    );


                resolve(dataUrl);

            };


            img.onerror = () => {

                reject(
                    new Error(
                        "Could not read image."
                    )
                );

            };


            img.src =
                event.target.result;

        };


        reader.onerror = () => {

            reject(
                new Error(
                    "File reading failed."
                )
            );

        };


        reader.readAsDataURL(file);

    });

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   IMAGE SELECTION
========================================================= */

imageFiles.addEventListener(
    "change",
    async event => {

        const files =
            Array.from(
                event.target.files || []
            );


        if (!files.length) {

            return;

        }


        const apiKey =
            localStorage.getItem(
                "gemini_api_key"
            );


        if (!apiKey) {

            alert(
                "Pehle Gemini API Key save karein."
            );

            imageFiles.value = "";

            return;

        }


        /*
            Maximum 10 images at once
        */

        if (files.length > 10) {

            alert(
                "Maximum 10 images ek baar me select kar sakte hain."
            );

            imageFiles.value = "";

            return;

        }


        /*
            Validate images
        */

        for (const file of files) {

            if (
                !file.type.startsWith("image/")
            ) {

                alert(
                    `${file.name} is not a valid image.`
                );

                imageFiles.value = "";

                return;

            }


            if (
                file.size >
                15 * 1024 * 1024
            ) {

                alert(
                    `${file.name} is larger than 15MB.`
                );

                imageFiles.value = "";

                return;

            }

        }


        uploadedImageFiles = files;

        generatedPrompts =
            new Array(files.length)
                .fill("");


        renderImageCards(files);


        selectedImagesInfo.textContent =
            `${files.length} image${files.length > 1 ? "s" : ""} selected`;


        selectedImagesInfo
            .classList
            .remove("hidden");


        /*
            Generate prompts sequentially
        */

        await generateAllPrompts(
            files,
            apiKey
        );

    }
);

    promptCount.textContent =
        `${files.length} image${files.length > 1 ? "s" : ""}`;


    files.forEach(
        (file, index) => {

            const card =
                document.createElement("div");


            card.id =
                `angle_card_${index}`;


            card.className =
                "image-card bg-zinc-950 border border-zinc-800 p-3 rounded-2xl";


            const url =
                URL.createObjectURL(file);


            card.innerHTML = `

                <div class="flex flex-col sm:flex-row gap-3">

                    <div class="flex-shrink-0">

                        <img
                            src="${url}"

                    </div>


                    <div class="flex-1 min-w-0">

                        <div class="flex items-center justify-between gap-2 mb-2">

                            <div>

                                <p class="text-xs font-semibold text-zinc-300">
                                    Image ${index + 1}
                                </p>

                                <p class="text-[9px] text-zinc-600 truncate max-w-[180px]">
                                    ${escapeHtml(file.name)}
                                </p>

                            </div>

                            >
                                <i class="fa-solid fa-clock mr-1"></i>
                                Waiting
                            </span>

                        </div>


                        <textarea

            URL.revokeObjectURL(url);

}

/* =========================================================
   GEMINI API
========================================================= */

async function generatePromptWithGemini(
    compressedDataUrl,
    apiKey
) {

    const parts =
        compressedDataUrl.split(",");


    if (parts.length !== 2) {

        throw new Error(
            "Invalid image data."
        );

    }


    const mimeMatch =
        parts[0].match(
            /data:(.*?);base64/
        );


    const mimeType =
        mimeMatch
            ? mimeMatch[1]
            : "image/jpeg";


    const base64 =
        parts[1];


    const url =
        `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`;


    const response =
        await fetch(
            url,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    contents: [

                        {

                            role: "user",

                            parts: [

                                {
                                    text:
                                        createGeminiPrompt()
                                },

                                {

                                    inline_data: {

                                        mime_type:
                                            mimeType,

                                        data:
                                            base64

                                    }

                                }

                            ]

                        }

                    ],


                    generationConfig: {

                        temperature: 0.7,

                        topP: 0.9,

                        maxOutputTokens: 4096

                    }

                })

            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        const apiMessage =
            data?.error?.message ||
            `HTTP ${response.status}`;

        throw new Error(
            apiMessage
        );

    }


    const text =
        data?.candidates?.[0]?.content?.parts
            ?.map(part => part.text || "")
            .join("")
            .trim();


    if (!text) {

        throw new Error(
            "Gemini returned an empty prompt."
        );

    }


    return text;

}


/* =========================================================
   GENERATE ALL PROMPTS
========================================================= */

async function generateAllPrompts(
    files,
    apiKey
) {

    for (
        let i = 0;
        i < files.length;
        i++
    ) {

        const card =
            document.getElementById(
                `angle_card_${i}`
            );


        if (!card) {

            continue;

        }


        const status =
            card.querySelector(
                ".status-indicator"
            );


        const textarea =
            card.querySelector(
                ".angle-prompt-input"
            );


        status.innerHTML =
            `<span class="text-amber-400">
                <span class="loader mr-1"></span>
                Analyzing...
            </span>`;


        try {

            const compressed =
                await compressImageToDataURL(
                    files[i]
                );


            const prompt =
                await generatePromptWithGemini(
                    compressed,
                    apiKey
                );


            textarea.value =
                prompt;


            generatedPrompts[i] =
                prompt;


            status.innerHTML =
                `<span class="text-emerald-400">
                    <i class="fa-solid fa-circle-check mr-1"></i>
                    Generated
                </span>`;


        } catch (error) {

            console.error(
                `Gemini error image ${i + 1}:`,
                error
            );


            /*
                Don't put fake prompt.
                Give user editable fallback.
            */

            textarea.value =
                `Create a highly detailed photorealistic recreation of the uploaded reference image. Preserve the subject's identity, facial structure, hairstyle, clothing, pose, composition, environment, lighting, colors, textures and overall visual style as accurately as possible. Maintain realistic skin texture, natural shadows, professional photography, accurate proportions, detailed materials, cinematic depth of field and high dynamic range.`;


            generatedPrompts[i] =
                textarea.value;


            status.innerHTML =
                `<span class="text-amber-400">
                    <i class="fa-solid fa-triangle-exclamation mr-1"></i>
                    Manual prompt
                </span>`;

        }


        /*
            Small delay between Gemini requests
            to reduce rate-limit problems.
        */

        if (
            i <
            files.length - 1
        ) {

            await sleep(1200);

        }

    }


    showStatus(
        `<i class="fa-solid fa-wand-magic-sparkles mr-2"></i>
         Prompt generation completed. You can edit every prompt before publishing.`,
        "success"
    );

}

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );

}


/* =========================================================
   IMGBB UPLOAD
========================================================= */

async function uploadImageToImgBB(file) {

    const formData =
        new FormData();


    formData.append(
        "image",
        file
    );


    const response =
        await fetch(
            `https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`,
            {
                method: "POST",
                body: formData
            }
        );


    const data =
        await response.json();


    if (
        !response.ok ||
        !data.success
    ) {

        throw new Error(
            data?.error?.message ||
            "ImgBB upload failed."
        );

    }


    return {

        url:
            data.data.display_url ||
            data.data.url,

        deleteUrl:
            data.data.delete_url ||
            null,

        thumb:
            data.data.thumb?.url ||
            data.data.url,

        medium:
            data.data.medium?.url ||
            data.data.url

    };

}


/* =========================================================
   UPLOAD SINGLE IMAGE WITH RETRY
========================================================= */

async function uploadWithRetry(
    file,
    attempts = 2
) {

    let lastError;


    for (
        let attempt = 1;
        attempt <= attempts;
        attempt++
    ) {

        try {

            return await uploadImageToImgBB(
                file
            );

        } catch (error) {

            lastError = error;

            if (
                attempt <
                attempts
            ) {

                await sleep(1200);

            }

        }

    }


    throw lastError;

}
