/* =====================================================
   CATEGORIES
===================================================== */

async function loadCategories() {

    categorySelect.innerHTML =
        `<option value="">Loading...</option>`;

    try {

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "categories"
                )
            );

        if (snapshot.empty) {

            for (
                const category
                of DEFAULT_CATEGORIES
            ) {

                await setDoc(
                    doc(
                        db,
                        "categories",
                        category
                    ),
                    {
                        name: category,
                        createdAt:
                            serverTimestamp()
                    }
                );

            }

            return loadCategories();

        }


        categorySelect.innerHTML =
            `<option value="">
                Select category
            </option>`;


        snapshot.forEach(
            categoryDoc => {

                const data =
                    categoryDoc.data();

                if (!data.name) return;

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    data.name;

                option.textContent =
                    data.name;

                categorySelect.appendChild(
                    option
                );

            }
        );

    }

    catch (error) {

        console.error(
            "Category error:",
            error
        );

        categorySelect.innerHTML =
            `<option value="Portraits">
                Portraits
            </option>`;

        showAlert(
            "Could not load Firebase categories.",
            "error"
        );

    }

}

/* =====================================================
   IMAGE COMPRESSION
===================================================== */

function compressImage(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                event => {

                    const img =
                        new Image();

                    img.onload =
                        () => {

                            const MAX =
                                1200;

                            let width =
                                img.width;

                            let height =
                                img.height;

                            const ratio =
                                Math.min(
                                    MAX / width,
                                    MAX / height,
                                    1
                                );

                            width =
                                Math.round(
                                    width * ratio
                                );

                            height =
                                Math.round(
                                    height * ratio
                                );

                            const canvas =
                                document.createElement(
                                    "canvas"
                                );

                            canvas.width =
                                width;

                            canvas.height =
                                height;

                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );

                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );

                            resolve(
                                canvas.toDataURL(
                                    "image/jpeg",
                                    0.85
                                )
                            );

                        };

                    img.onerror =
                        () => reject(
                            new Error(
                                "Image loading failed."
                            )
                        );

                    img.src =
                        event.target.result;

                };

            reader.onerror =
                () => reject(
                    new Error(
                        "Image reading failed."
                    )
                );

            reader.readAsDataURL(file);

        }
    );

}


/* =====================================================
   FILE BASE64
===================================================== */

function fileToBase64(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => resolve(
                    reader.result
                );

            reader.onerror =
                () => reject(
                    new Error(
                        "Could not read image."
                    )
                );

            reader.readAsDataURL(file);

        }
    );

}


/* =====================================================
   GEMINI PROMPT GENERATION
===================================================== */

async function generateGeminiPrompt(
    file
) {

    const apiKey =
        getGeminiKey();

    if (!apiKey) {

        throw new Error(
            "Gemini API key is missing."
        );

    }


    const base64 =
        await fileToBase64(
            file
        );

    const parts =
        base64.split(",");

    const cleanBase64 =
        parts[1];

    const mimeType =
        parts[0]
        .match(
            /:(.*?);/
        )[1];


    const instruction = `
You are an expert AI vision analyst and elite prompt engineer.

Analyze this reference image with extreme precision.

Create one exceptionally detailed professional AI image-generation prompt that recreates this exact visual composition.

Include:

- subject appearance
- face and hair
- clothing
- fabric
- colors
- patterns
- accessories
- pose
- body position
- hand position
- facial expression
- camera angle
- framing
- perspective
- background
- architecture
- environment
- lighting
- shadows
- highlights
- skin texture
- depth of field
- lens characteristics
- photographic style
- color grading
- atmosphere
- small visible details

If the image contains a person, include instructions that allow the user's own face/identity to be preserved while maintaining the same pose, clothing, composition and environment.

The final prompt must be detailed enough for an advanced image-generation model.

Return ONLY the prompt.

Do not use markdown.

Do not add headings.

Do not explain anything.
`;


    const response =
        await fetch(
            `${GEMINI_URL}?key=${encodeURIComponent(apiKey)}`,
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    contents: [

                        {

                            role: "user",

                            parts: [

                                {
                                    text:
                                        instruction
                                },

                                {
                                    inline_data: {

                                        mime_type:
                                            mimeType,

                                        data:
                                            cleanBase64

                                    }
                                }

                            ]

                        }

                    ],

                    generationConfig: {

                        temperature: 0.65,

                        maxOutputTokens: 2500

                    }

                })

            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        console.error(
            "Gemini response:",
            data
        );

        throw new Error(
            data?.error?.message ||
            `Gemini error ${response.status}`
        );

    }


    const text =
        data
        ?.candidates?.[0]
        ?.content?.parts
        ?.map(
            part =>
                part.text || ""
        )
        .join("")
        .trim();


    if (!text) {

        throw new Error(
            "Gemini returned an empty prompt."
        );

    }


    return text;

}

   GENERATE ONE PROMPT
===================================================== */

async function generatePrompt(
    index

        imageItems[index];

    const status =
        document.getElementById(
            `status-${index}`
        );

    const textarea =
        document.getElementById(
            `prompt-${index}`
        );


    status.innerHTML =
        `<span class="text-amber-400">
            <i class="fa-solid fa-spinner fa-spin mr-1"></i>
            Gemini analyzing...
        </span>`;


    try {

        const prompt =
            await generateGeminiPrompt(
                item.file
            );

        item.prompt =
            prompt;

        textarea.value =
            prompt;

        status.innerHTML =
            `<span class="text-emerald-400">
                <i class="fa-solid fa-check mr-1"></i>
                Ready
            </span>`;

    }

    catch (error) {

        console.error(error);

        status.innerHTML =
            `<span class="text-red-400">
                <i class="fa-solid fa-xmark mr-1"></i>
                Failed
            </span>`;

        showAlert(
            `Angle ${index + 1}: ${error.message}`,
            "error"
        );

    }

}


/* =====================================================
   HANDLE FILES
===================================================== */

async function handleFiles(
    files
) {

    const validFiles =
        Array.from(files)
        .filter(
            file =>
                file.type.startsWith(
                    "image/"
                )
        );


    if (!validFiles.length) {

        showAlert(
            "No valid image selected.",
            "error"
        );

        return;

    }


    selectedFiles =
        validFiles;

    imageItems =
        [];

    container.innerHTML =
        "";

    promptSection.classList.remove(
        "hidden"
    );


    document
    .getElementById(
        "fileCount"
    )
    .classList.remove(
        "hidden"
    );


    document
    .getElementById(
        "fileCount"
    )
    .textContent =
        `${validFiles.length} image(s) selected`;


    document
    .getElementById(
        "promptCount"
    )
    .textContent =
        `${validFiles.length} angle(s)`;


    for (
        let i = 0;
        i < validFiles.length;
        i++
    ) {

        const file =
            validFiles[i];

        const preview =
            await compressImage(
                file
            );


        const item = {

            file,
            preview,
            prompt: ""

        };


        imageItems.push(
            item
        );


        renderImageCard(
            i,
            item
        );

    }


    /* Generate prompts one by one */

    for (
        let i = 0;
        i < imageItems.length;
        i++
    ) {

        await generatePrompt(
            i
        );

        if (
            i <
            imageItems.length - 1
        ) {

            await sleep(
                1000
            );

        }

    }

}

/* =====================================================
   FIREBASE STORAGE UPLOAD
===================================================== */

async function uploadToFirebaseStorage(
    file,
    index
) {

    const safeName =
        file.name
        .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
        );


    const filePath =
        `promptgenz/posts/${Date.now()}_${index}_${safeName}`;


    const storageRef =
        ref(
            storage,
            filePath
        );


    const snapshot =
        await uploadBytes(
            storageRef,
            file,
            {
                contentType:
                    file.type
            }
        );


    const downloadURL =
        await getDownloadURL(
            snapshot.ref
        );


    return {

        url:
            downloadURL,

        path:
            filePath

    };

}
